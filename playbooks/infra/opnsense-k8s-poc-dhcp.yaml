---
# Active le serveur DHCP ISC sur opt16 (VLAN 1300) et ajoute les baux statiques
# MAC→IP pour les 13 VMs k8s-poc.
#
# Les MACs ont été extraits des VMs Proxmox après création.
# Les IPs correspondent aux host_vars (10.0.130.11-15 CPs, 10.0.130.21-28 workers).
#
# Idempotent : vérifie les MACs existants avant d'ajouter.
# Config sync vers opnsense02 via XMLRPC HA automatiquement.
#
# Usage :
#   ansible-playbook playbooks/infra/opnsense-k8s-poc-dhcp.yaml -i inventories/infra/

- name: Configure DHCP on OPNsense opt16 for k8s-poc (VLAN 1300)
  hosts: opnsense01.prod.etsmtl.club
  gather_facts: false
  connection: local

  vars:
    opnsense_host: "{{ vm_net.ip }}"
    k8s_poc_dhcp_maps:
      - { mac: "bc:24:11:48:c1:70", ip: "10.0.130.11", hostname: "k8s-poc-controlplane01" }
      - { mac: "bc:24:11:50:59:34", ip: "10.0.130.12", hostname: "k8s-poc-controlplane02" }
      - { mac: "bc:24:11:b8:c5:2b", ip: "10.0.130.13", hostname: "k8s-poc-controlplane03" }
      - { mac: "bc:24:11:b3:0b:5a", ip: "10.0.130.14", hostname: "k8s-poc-controlplane04" }
      - { mac: "bc:24:11:5b:77:18", ip: "10.0.130.15", hostname: "k8s-poc-controlplane05" }
      - { mac: "bc:24:11:46:8f:c2", ip: "10.0.130.21", hostname: "k8s-poc-worker01" }
      - { mac: "bc:24:11:59:a7:01", ip: "10.0.130.22", hostname: "k8s-poc-worker02" }
      - { mac: "bc:24:11:05:21:57", ip: "10.0.130.23", hostname: "k8s-poc-worker03" }
      - { mac: "bc:24:11:bc:d6:b7", ip: "10.0.130.24", hostname: "k8s-poc-worker04" }
      - { mac: "bc:24:11:fc:2c:39", ip: "10.0.130.25", hostname: "k8s-poc-worker05" }
      - { mac: "bc:24:11:39:ea:8a", ip: "10.0.130.26", hostname: "k8s-poc-worker06" }
      - { mac: "bc:24:11:4a:cc:14", ip: "10.0.130.27", hostname: "k8s-poc-worker07" }
      - { mac: "bc:24:11:c7:cb:69", ip: "10.0.130.28", hostname: "k8s-poc-worker08" }

  tasks:
    - name: Enable DHCP server on opt16 with dynamic pool
      ansible.builtin.uri:
        url: "https://{{ opnsense_host }}/api/dhcpv4/settings/set"
        method: POST
        user: "{{ opnsense_api_key }}"
        password: "{{ opnsense_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          dhcpd:
            opt16:
              enable: "1"
              range:
                from: "10.0.130.100"
                to: "10.0.130.200"
              gateway: "10.0.130.1"
              dnsserver: "1.1.1.1"
        status_code: 200
      no_log: true
      register: _dhcp_enable

    - name: Get existing static maps for opt16
      ansible.builtin.uri:
        url: "https://{{ opnsense_host }}/api/dhcpv4/settings/searchStaticMap/opt16"
        method: GET
        user: "{{ opnsense_api_key }}"
        password: "{{ opnsense_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      no_log: true
      register: _existing_maps

    - name: Build list of already-configured MACs
      ansible.builtin.set_fact:
        _existing_macs: "{{ _existing_maps.json.rows | map(attribute='mac') | map('lower') | list }}"

    - name: Add static DHCP mappings
      ansible.builtin.uri:
        url: "https://{{ opnsense_host }}/api/dhcpv4/settings/addStaticMap/opt16"
        method: POST
        user: "{{ opnsense_api_key }}"
        password: "{{ opnsense_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body:
          mac: "{{ item.mac }}"
          ipaddr: "{{ item.ip }}"
          hostname: "{{ item.hostname }}"
        status_code: 200
      loop: "{{ k8s_poc_dhcp_maps }}"
      when: item.mac | lower not in _existing_macs
      no_log: true
      loop_control:
        label: "{{ item.hostname }} ({{ item.ip }})"

    - name: Restart DHCP service to apply config
      ansible.builtin.uri:
        url: "https://{{ opnsense_host }}/api/dhcpv4/service/restart"
        method: POST
        user: "{{ opnsense_api_key }}"
        password: "{{ opnsense_api_secret }}"
        force_basic_auth: true
        validate_certs: false
        status_code: 200
      no_log: true
