---
# Provisionne les VMs et déploie Kea DHCP4 sur netservices_dhcp (infra permanente) avec validation post-deploy.
# NOTE : doublon de netservices/dhcp.yaml — ce playbook ajoute `kea-dhcp4 -t` en post_task.
# Conserver celui-ci comme référence pour les déploiements infra (valide la config avant de continuer).
# Hôtes : netservices_dhcp
# Usage : make infra/dhcp

- name: Provision DHCP VMs on Proxmox
  hosts: netservices_dhcp
  gather_facts: false
  become: false
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false
  roles:
    - cedille.proxmox.vm

- name: Wait for SSH on DHCP VMs
  hosts: netservices_dhcp
  gather_facts: false
  tasks:
    - name: Wait for SSH to be available
      ansible.builtin.wait_for_connection:
        timeout: 120

- name: Deploy DHCP
  hosts: netservices_dhcp
  gather_facts: true
  become: true
  roles:
    - cedille.netservices.dhcp
  post_tasks:
    - name: Validate Kea config
      ansible.builtin.command:
        cmd: kea-dhcp4 -t /etc/kea/kea-dhcp4.conf
      changed_when: false
