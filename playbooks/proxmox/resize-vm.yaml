---
# Resize cores/memory d'une VM Proxmox existante vers les valeurs cibles host_vars.
# Ne PAS lancer contre plusieurs nodes k8s-shared à la fois : pas de hot-plug garanti,
# la VM doit stop/start pour appliquer le changement. Toujours --limit un seul host,
# suivre le cycle drain->stop->resize->start->uncordon (resize-runbook.md).
#
# Usage (un node à la fois, ex. worker-2) :
#   make proxmox/resize-vm LIMIT=k8s-shared-worker-2
- name: Resize existing Proxmox VM (cores/memory)
  hosts: k8s_shared
  gather_facts: false
  become: false
  serial: 1
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false

  tasks:
    - name: Resize VM cores/memory
      ansible.builtin.include_role:
        name: cedille.proxmox.vm
        tasks_from: resize_vm
