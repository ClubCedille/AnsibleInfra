---
# Gère les sources APT (Proxmox/Ceph/Debian/Grafana) en deb822 sur les hôtes
# PVE.
#
# Hôtes : pve
# Usage : make proxmox/apt-sources (DRY_RUN=1 recommandé avant un premier run)

- name: Manage APT sources on Proxmox hosts
  hosts: pve
  gather_facts: true
  become: true
  vars:
    apt_sources_ceph:
      enabled: true
      version: trixie
      release: tentacle
      channel: no-subscription
    apt_sources_grafana:
      enabled: true
      key_url: https://apt.grafana.com/gpg-full.key
      key_path: /etc/apt/keyrings/grafana.asc
      uris: https://apt.grafana.com
      suites: stable
      components: main
  roles:
    - cedille.proxmox.apt_sources
