---
# Rattache les 3 NOUVEAUX nodes de k8s-shared (worker-6, worker-7, controlplane-4) au
# cluster existant (RUNNING depuis 2025-04-24, cf. omnictl get machinesets).
#
# Contrairement à k8s-poc (MachineSetNodes créés manuellement, cf. k8s-poc-cluster.yaml),
# les MachineSets de k8s-shared utilisent l'allocation automatisée par MachineClass
# (constaté en exécution réelle le 2026-08-17 : "adding machine set node ... is not allowed:
# the machine set is using automated machine allocation"). Vérifié via
# `omnictl get machinesets/machineclasses` : k8s-shared-control-planes/k8s-shared-workers
# référencent les MachineClasses k8s-shared-controlplane/k8s-shared-worker, qui matchent sur
# les labels `role` + `cluster-candidate` (mécanisme documenté dans notes.md section 1). Ce
# playbook labellise donc les machines au lieu de créer des MachineSetNodes — Omni les
# rattache lui-même automatiquement une fois les labels posés.
#
# Ne touche PAS aux Clusters.omni.sidero.dev / MachineSets.omni.sidero.dev existants.
#
# Prérequis : les 3 VMs doivent avoir booté et être visibles dans Omni UI (état "Available").
# Exécuté en local — utilise omnictl avec l'auth interactive déjà en cache (~/.talos/keys/).
#
# Découverte des machines par cores (pas par hostname) : constaté en exécution réelle le
# 2026-08-17, Omni n'assigne pas de hostname à ces machines (VLANs 500/1009 n'ont pas de
# mécanisme DHCP/reverse-DNS documenté, cf. notes.md) — l'UI affiche l'UUID brut à la place.
# La tâche identifie donc les 3 nouvelles machines par : pas encore assignées à un cluster
# (absence du label omni.sidero.dev/cluster) + nombre de cores correspondant à la cible
# (host_vars controlplane-4/worker-6). Sûr ici car un seul CP et deux workers avec ces cores
# exacts sont attendus parmi les machines non assignées de tout l'organisme Omni.
#
# Usage : ansible-playbook playbooks/omni/k8s-shared-cluster.yaml -i inventories/infra/
- name: Label new k8s-shared machines for automated Omni allocation
  hosts: localhost
  gather_facts: false
  become: false

  tasks:
    - name: Fetch machine UUIDs from Omni (unassigned machines, matched by hardware spec)
      # Ne peut pas discriminer par hostname : Omni n'a pas de hostname pour ces machines
      # (aucun mécanisme DHCP/reverse-DNS documenté pour ces VLANs — cf. notes.md, section
      # "Réseau" — omnictl affiche l'UUID brut à la place, constaté en exécution réelle le
      # 2026-08-17). Discrimine plutôt par : (a) absence du label
      # "omni.sidero.dev/cluster" (= pas encore assigné à un cluster/MachineSet), (b) cores
      # correspondant à la cible controlplane-4 (vm_cpu_cores du group_vars CP) ou
      # worker-6/worker-7 (vm_cpu_cores du group_vars workers).
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          omnictl get machinestatuses -o yaml | python3 -c "
          import sys, re, json
          content = sys.stdin.read()
          docs = content.split('\n---\n')
          result = {'cp': [], 'worker': []}
          for doc in docs:
              uuid_m = re.search(r'^\s+id:\s+([0-9a-f-]{36})', doc, re.MULTILINE)
              if not uuid_m:
                  continue
              if re.search(r'omni\.sidero\.dev/cluster:', doc):
                  continue
              cores_m = re.search(r'omni\.sidero\.dev/cores:\s+(\d+)', doc)
              if not cores_m:
                  continue
              uuid = uuid_m.group(1)
              cores = int(cores_m.group(1))
              if cores == {{ cp_target_cores }}:
                  result['cp'].append(uuid)
              elif cores == {{ worker_target_cores }}:
                  result['worker'].append(uuid)
          print(json.dumps(result))
          "
      register: machine_uuids_raw
      vars:
        cp_target_cores: "{{ hostvars['k8s-shared-controlplane-4'].vm_cpu_cores }}"
        worker_target_cores: "{{ hostvars['k8s-shared-worker-6'].vm_cpu_cores }}"
      changed_when: false
      args:
        # /bin/bash n'existe pas sur NixOS (pas de FHS /bin standard) — /bin/sh est le seul
        # chemin garanti présent partout ; ici c'est un lien vers bash, donc "set -o pipefail"
        # fonctionne quand même.
        executable: /bin/sh

    - name: Parse machine UUID lists
      ansible.builtin.set_fact:
        omni_k8s_shared_new_cp_uuids: "{{ (machine_uuids_raw.stdout | from_json).cp }}"
        omni_k8s_shared_new_worker_uuids: "{{ (machine_uuids_raw.stdout | from_json).worker }}"

    - name: Show discovered machine counts
      ansible.builtin.debug:
        msg: >
          Found {{ omni_k8s_shared_new_cp_uuids | length }} new control planes,
          {{ omni_k8s_shared_new_worker_uuids | length }} new workers
          (attendu : 1 CP, 2 workers)

    - name: Assert expected new machine counts
      ansible.builtin.assert:
        that:
          - omni_k8s_shared_new_cp_uuids | length == 1
          - omni_k8s_shared_new_worker_uuids | length == 2
        fail_msg: >
          Expected 1 new CP (controlplane-4) and 2 new workers (worker-6, worker-7), got
          {{ omni_k8s_shared_new_cp_uuids | length }} CPs and {{ omni_k8s_shared_new_worker_uuids | length }} workers.
          Vérifier que les 3 VMs sont bien "Available"/"connected" dans Omni (omnictl get
          machines), qu'aucune n'est déjà assignée à un cluster, et que leurs cores
          correspondent à la cible (CP: {{ hostvars['k8s-shared-controlplane-4'].vm_cpu_cores }},
          workers: {{ hostvars['k8s-shared-worker-6'].vm_cpu_cores }}) avant de relancer.

    # Cible MachineLabels.omni.sidero.dev (id = UUID machine), PAS Machines.omni.sidero.dev :
    # rencontré en exécution réelle "PermissionDenied ... only read access is permitted" en
    # ciblant Machines (owner: MachineController, géré par un controller, en lecture seule
    # pour les clients API). MachineLabels est la ressource dédiée aux labels posés par
    # l'utilisateur (owner vide, confirmé éditable), visible dans l'UI Omni via le bouton
    # "+ new label" sur chaque machine.
    #
    # Idempotent : relit la ressource, saute si les 2 labels sont déjà présents. Préserve tout
    # le reste du document (ex. annotations "platform-tag-labels-initialized") — un
    # `omnictl apply` avec un document incomplet REMPLACE la ressource entière (constaté en
    # dry-run sur Machines : un spec vide remettait connected à false). Gère les deux cas :
    # une machine déjà labellisée a un bloc "labels:" existant (on y ajoute nos 2 entrées) ;
    # une machine neuve n'en a aucun (on insère le bloc "labels:" avant "spec: {}").
    - name: Label new control-plane machine for automated allocation
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          python3 -c "
          import re, subprocess, sys
          uuid = '{{ item }}'
          current = subprocess.run(['omnictl', 'get', 'machinelabel', uuid, '-o', 'yaml'], capture_output=True, text=True, check=True).stdout
          if re.search(r'^\s+role:\s*controlplane\s*$', current, re.MULTILINE) and re.search(r'^\s+cluster-candidate:\s*k8s-shared\s*$', current, re.MULTILINE):
              print(uuid + ': already labeled, skipping')
              sys.exit(0)
          label_lines = '    labels:\n        role: controlplane\n        cluster-candidate: k8s-shared\n'
          if re.search(r'^    labels:\s*$', current, re.MULTILINE):
              patched = re.sub(r'(    labels:\n)', r'\1        role: controlplane\n        cluster-candidate: k8s-shared\n', current, count=1)
          else:
              patched = current.replace('spec: {}', label_lines + 'spec: {}')
          dest = '/tmp/omni-label-' + uuid + '.yaml'
          with open(dest, 'w') as f:
              f.write(patched)
          subprocess.run(['omnictl', 'apply', '-f', dest], check=True)
          print(uuid + ': labeled role=controlplane cluster-candidate=k8s-shared')
          "
      loop: "{{ omni_k8s_shared_new_cp_uuids }}"
      register: cp_label_result
      changed_when: "'labeled role=' in cp_label_result.stdout"
      args:
        executable: /bin/sh

    - name: Label new worker machines for automated allocation
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          python3 -c "
          import re, subprocess, sys
          uuid = '{{ item }}'
          current = subprocess.run(['omnictl', 'get', 'machinelabel', uuid, '-o', 'yaml'], capture_output=True, text=True, check=True).stdout
          if re.search(r'^\s+role:\s*worker\s*$', current, re.MULTILINE) and re.search(r'^\s+cluster-candidate:\s*k8s-shared\s*$', current, re.MULTILINE):
              print(uuid + ': already labeled, skipping')
              sys.exit(0)
          label_lines = '    labels:\n        role: worker\n        cluster-candidate: k8s-shared\n'
          if re.search(r'^    labels:\s*$', current, re.MULTILINE):
              patched = re.sub(r'(    labels:\n)', r'\1        role: worker\n        cluster-candidate: k8s-shared\n', current, count=1)
          else:
              patched = current.replace('spec: {}', label_lines + 'spec: {}')
          dest = '/tmp/omni-label-' + uuid + '.yaml'
          with open(dest, 'w') as f:
              f.write(patched)
          subprocess.run(['omnictl', 'apply', '-f', dest], check=True)
          print(uuid + ': labeled role=worker cluster-candidate=k8s-shared')
          "
      loop: "{{ omni_k8s_shared_new_worker_uuids }}"
      register: worker_label_result
      changed_when: "'labeled role=' in worker_label_result.stdout"
      args:
        executable: /bin/sh

    - name: Remind operator to verify automated attachment
      ansible.builtin.debug:
        msg: >-
          Labels posés. Omni devrait rattacher automatiquement les 3 machines aux MachineSets
          (allocation automatisée, pas de MachineSetNode à créer). Vérifier avec :
          omnictl cluster status k8s-shared ; kubectl --context=cedille-k8s-shared get nodes -o wide
