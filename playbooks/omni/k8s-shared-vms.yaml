        api_password: "{{ vm_proxmox_api.password }}"
        api_host: "{{ vm_proxmox_api.host }}"
        vmid: "{{ vm_id }}"
        state: restarted
      delegate_to: localhost
      when: vm_power_cycle | default(false) | bool
      throttle: 1

    - name: Start VM
      community.proxmox.proxmox_kvm:
        api_user: "{{ vm_proxmox_api.user }}"
        api_password: "{{ vm_proxmox_api.password }}"
        api_host: "{{ vm_proxmox_api.host }}"
        vmid: "{{ vm_id }}"
        state: started
      delegate_to: localhost
      when: vm_start_after_creation | default(true)
