---
# Provision les 3 nouveaux nodes k8s-shared (worker-6/pve05, worker-7/pve08,
# controlplane-4/pve01) sur Proxmox via boot ISO, sur le modèle de k8s-poc-vms.yaml.
#
# Les VMs k8s-shared existantes (worker-0..5, controlplane-0..3) n'ont PAS été
# provisionnées avec ce pattern exact — leur disque est sur "ide0" (250G, boot direct,
# pas de CDROM d'installation visible) plutôt que "virtio0" avec ide2 en CDROM comme dans
# k8s-poc-vms.yaml. Aucun playbook d'origine retrouvé pour ces 9 VMs (cf. group_vars/k8s_shared.yaml).
# Ce playbook reproduit le pattern k8s-poc connu et documenté (ISO boot → self-install →
# reboot, cf. docs/omni-cluster-provisioning.md étape 4) en alignant le device disque sur
# "ide0" (group_vars/k8s_shared.yaml: vm_disk_device) pour rester cohérent avec les 9 nodes
# existants. À VALIDER par l'opérateur avant toute exécution réelle — voir le runbook
# ~/Cedille/docs/migration-prodv2-to-k8s-shared/resize-runbook.md pour le rappel explicite
# de ce point.
#
# Prerequisites (NON remplis à ce stade, cf. tâche 4 du prompt de délégation) :
#   - Image Talos générée depuis l'UI Omni pour k8s-shared (token d'enrôlement propre au
#     cluster — ne PAS réutiliser celle de k8s-poc) et uploadée sur pve01/pve05/pve08 :
#     ansible-playbook playbooks/proxmox/upload-talos-iso.yaml
#   - VLAN 500 déjà actif sur tous les hosts PVE (utilisé par les VMs k8s-shared existantes,
#     aucune action réseau attendue ici contrairement à l'étape 1 de k8s-poc)
#   - Les 3 VMs ne doivent pas déjà exister

- name: Provision new k8s-shared nodes on Proxmox (ISO boot)
  hosts: k8s-shared-worker-6,k8s-shared-worker-7,k8s-shared-controlplane-4
  gather_facts: false
  become: false
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false

  tasks:
    - name: Create VM with blank boot disk
      community.proxmox.proxmox_kvm:
        api_user: "{{ vm_proxmox_api.user }}"
        api_password: "{{ vm_proxmox_api.password }}"
        api_host: "{{ vm_proxmox_api.host }}"
        vmid: "{{ vm_id }}"
        name: "{{ vm_name }}"
        node: "{{ vm_proxmox_node }}"
        memory: "{{ vm_memory_mb }}"
        cores: "{{ vm_cpu_cores }}"
        bios: seabios
        machine: q35
        cpu: host
        agent: enabled=1
        boot: "order=ide0;ide2"
        ide:
          # ide0 hardcodé (pas templé depuis vm_disk_device) : fixe pour tout le groupe
          # k8s_shared, cf. group_vars/k8s_shared.yaml.
          ide0: "{{ vm_disk_storage }}:{{ vm_disk_size | regex_replace('G$', '') }}"
          ide2: "local:iso/talos-k8s-shared-bios-nocloud-amd64.iso,media=cdrom"
        net:
          net0: "virtio,bridge={{ vm_net.bridge }},tag={{ vm_net.vlan }},mtu={{ vm_net.mtu | default(1500) }}"
        onboot: "{{ vm_onboot }}"
        state: present
      delegate_to: localhost

    - name: Enable QEMU guest agent on existing VM
      community.proxmox.proxmox_kvm:
        api_user: "{{ vm_proxmox_api.user }}"
        api_password: "{{ vm_proxmox_api.password }}"
        api_host: "{{ vm_proxmox_api.host }}"
        vmid: "{{ vm_id }}"
        node: "{{ vm_proxmox_node }}"
        agent: enabled=1
        state: present
        update: true
      delegate_to: localhost

    - name: Power-cycle VM to apply hardware config changes (e.g. qemu guest agent channel)
      community.proxmox.proxmox_kvm:
        api_user: "{{ vm_proxmox_api.user }}"
        api_password: "{{ vm_proxmox_api.password }}"
        api_host: "{{ vm_proxmox_api.host }}"
        vmid: "{{ vm_id }}"
        state: restarted
      delegate_to: localhost
      when: vm_power_cycle | default(false) | bool
      throttle: 1

    - name: Start VM
      community.proxmox.proxmox_kvm:
        api_user: "{{ vm_proxmox_api.user }}"
        api_password: "{{ vm_proxmox_api.password }}"
        api_host: "{{ vm_proxmox_api.host }}"
        vmid: "{{ vm_id }}"
        state: started
      delegate_to: localhost
      when: vm_start_after_creation | default(true)
