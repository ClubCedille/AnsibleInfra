---
# Provision les 3 nouveaux nodes k8s-shared (worker-6/pve05, worker-7/pve08,
# controlplane-4/pve01) sur Proxmox, en reproduisant la configuration exacte des 10 VMs
# k8s-shared existantes — vérifiée via `pvesh get .../qemu/<vmid>/config` et
# `omnictl get machinestatuses` sur les 10 nodes le 2026-08-17 (aucun playbook d'origine
# retrouvé, tag Proxmox "TF" présent sur ces VMs mais sans correspondance dans les repos
# Terraform clonés localement — origine non déterminée) :
#
#   - Control-planes : disque unique scsi0 (40G, virtio-scsi), 2 NICs (VLAN 500 + VLAN 1009).
#   - Workers : disque unique ide0 (250G), 3 NICs (VLAN 500 + VLAN 1009 + VLAN 247/IP publique).
#   - ostype "other" (pas l26), pas de cloud-init.
#   - Boot ISO self-install (comme k8s-poc-vms.yaml) : une control-plane existante rapporte
#     encore un CD-ROM dans son inventaire matériel Talos (device resté dans l'état interne
#     d'Omni depuis l'installation initiale, taille cohérente avec l'ISO) — le CDROM est
#     ensuite éjecté du config Proxmox après l'installation, comme sur k8s-poc.
#   - VLAN 1009 (tag net1) = réseau réel des nodes Talos/Kubernetes (10.5.9.0/24, confirmé via
#     l'interface OPNsense vtnet0_vlan1009) ; usage exact de VLAN 500 (net0) non déterminé.
#
# Reconstruction sur la base de l'état observé, sans playbook source retrouvé — à valider par
# l'opérateur avant toute exécution réelle (cf.
# ~/Cedille/docs/migration-prodv2-to-k8s-shared/resize-runbook.md).
#
# Prerequisites :
#   - ISO Talos k8s-shared uploadée sur pve01/pve05/pve08 :
#     ansible-playbook playbooks/proxmox/upload-talos-iso-k8s-shared.yaml -i inventories/infra/
#   - VLANs 500/1009/247 déjà actifs sur pve01/pve05/pve08 (utilisés par les VMs k8s-shared
#     existantes, aucune action réseau attendue ici)
#   - Les 3 VMs ne doivent pas déjà exister

- name: Provision new k8s-shared control-plane (scsi0 disk, 2 NICs, ISO boot)
  hosts: k8s-shared-controlplane-4
  gather_facts: false
  become: false
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false

  tasks:
    - name: Create VM with blank boot disk
      community.proxmox.proxmox_kvm:
        api_user: "{{ vm_proxmox_api.user }}"
        api_password: "{{ vm_proxmox_api.password }}"
        api_host: "{{ vm_proxmox_api.host }}"
        vmid: "{{ vm_id }}"
        name: "{{ vm_name }}"
        node: "{{ vm_proxmox_node }}"
        memory: "{{ vm_memory_mb }}"
        cores: "{{ vm_cpu_cores }}"
        bios: seabios
        machine: q35
        cpu: host
        ostype: "{{ vm_ostype }}"
        agent: "{{ vm_agent }}"
        scsihw: "{{ vm_scsihw }}"
        boot: "order=scsi0;ide2"
        scsi:
          scsi0: "{{ vm_disk_storage }}:{{ vm_disk_size | regex_replace('G$', '') }}"
        ide:
          ide2: "local:iso/{{ vm_talos_iso_filename }},media=cdrom"
        net:
          net0: "{{ vm_net_device }},bridge={{ vm_net_bridge }},tag={{ vm_net_mgmt_vlan }},mtu={{ vm_net_mtu }}"
          net1: "{{ vm_net_device }},bridge={{ vm_net_bridge }},tag={{ vm_net_pod_vlan }},mtu={{ vm_net_mtu }}"
        onboot: "{{ vm_onboot }}"
        state: present
      delegate_to: localhost

    - name: Enable QEMU guest agent on existing VM
      community.proxmox.proxmox_kvm:
        api_user: "{{ vm_proxmox_api.user }}"
        api_password: "{{ vm_proxmox_api.password }}"
        api_host: "{{ vm_proxmox_api.host }}"
        vmid: "{{ vm_id }}"
        node: "{{ vm_proxmox_node }}"
        agent: "{{ vm_agent }}"
        state: present
        update: true
      delegate_to: localhost

    - name: Power-cycle VM to apply hardware config changes (e.g. qemu guest agent channel)
      community.proxmox.proxmox_kvm:
        api_user: "{{ vm_proxmox_api.user }}"
        api_password: "{{ vm_proxmox_api.password }}"
        api_host: "{{ vm_proxmox_api.host }}"
        vmid: "{{ vm_id }}"
        state: restarted
      delegate_to: localhost
      when: vm_power_cycle | default(false) | bool
      throttle: 1

    - name: Start VM
      community.proxmox.proxmox_kvm:
        api_user: "{{ vm_proxmox_api.user }}"
        api_password: "{{ vm_proxmox_api.password }}"
        api_host: "{{ vm_proxmox_api.host }}"
        vmid: "{{ vm_id }}"
        state: started
      delegate_to: localhost
      when: vm_start_after_creation | default(true)

- name: Provision new k8s-shared workers (ide0 disk, 3 NICs, ISO boot)
  hosts: k8s-shared-worker-6,k8s-shared-worker-7
