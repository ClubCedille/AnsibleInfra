---
# Synchronise les VLANs sur les hôtes Proxmox ET sur le switch core NX-OS.
# Source de vérité : pve_vlans_desired / pve_vlans_to_remove dans group_vars/pve.yaml.
#
# Usage : make network/update-vlans [VAULT_PASSWORD_FILE=~/.vault]

# ── Play 1 : sous-interfaces VLAN sur les hôtes Proxmox ───────────────────────
- name: Update VLAN sub-interfaces on PVE nodes
  hosts: pve
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false
  connection: local

  tasks:
    - name: Get current network interfaces
      community.proxmox.proxmox_node_network_info:
        api_host: "{{ ansible_host }}"
        api_user: "{{ pve_api_user }}"
        api_password: "{{ pve_api_password }}"
        node: "{{ inventory_hostname | split('.') | first }}"
      register: net_info

    - name: Set current iface list
      ansible.builtin.set_fact:
        current_ifaces: "{{ net_info.proxmox_node_networks | map(attribute='iface') | list }}"

    - name: Current VLAN sub-interfaces
      ansible.builtin.debug:
        msg: >-
          {{
            net_info.proxmox_node_networks
            | selectattr('type', 'defined')
            | selectattr('type', 'equalto', 'vlan')
            | map(attribute='iface')
            | list
            | sort
          }}

    - name: Ensure MTU is 9216 (jumbo frames) on {{ pve_trunk_bridge }}
      community.proxmox.proxmox_node_network:
        api_host: "{{ ansible_host }}"
        api_user: "{{ pve_api_user }}"
        api_password: "{{ pve_api_password }}"
        node: "{{ inventory_hostname | split('.') | first }}"
        state: present
        iface: "{{ pve_trunk_bridge }}"
        iface_type: bridge
        mtu: 9216

    - name: Stage removal of dead VLAN sub-interfaces
      community.proxmox.proxmox_node_network:
        api_host: "{{ ansible_host }}"
        api_user: "{{ pve_api_user }}"
        api_password: "{{ pve_api_password }}"
        node: "{{ inventory_hostname | split('.') | first }}"
        state: absent
        iface: "{{ pve_trunk_bridge }}.{{ item.id }}"
      loop: "{{ pve_vlans_to_remove }}"
      loop_control:
        label: "{{ pve_trunk_bridge }}.{{ item.id }} — {{ item.comment }}"
      when: (pve_trunk_bridge ~ '.' ~ item.id | string) in current_ifaces

    - name: Ensure desired VLAN sub-interfaces are present
      community.proxmox.proxmox_node_network:
        api_host: "{{ ansible_host }}"
        api_user: "{{ pve_api_user }}"
        api_password: "{{ pve_api_password }}"
        node: "{{ inventory_hostname | split('.') | first }}"
        state: present
        iface: "{{ pve_trunk_bridge }}.{{ item.id }}"
        iface_type: vlan
        autostart: true
        mtu: "{{ item.mtu | default(1500) }}"
        comments: "{{ item.comment }}"
      loop: "{{ pve_vlans_desired }}"
      loop_control:
        label: "{{ pve_trunk_bridge }}.{{ item.id }} — {{ item.comment }}"

    - name: Check for pending staged changes before applying
      community.proxmox.proxmox_node_network_info:
        api_host: "{{ ansible_host }}"
        api_user: "{{ pve_api_user }}"
        api_password: "{{ pve_api_password }}"
        node: "{{ inventory_hostname | split('.') | first }}"
        check_changes: true
      register: pending

    - name: Apply staged network changes (ifreload -a)
      community.proxmox.proxmox_node_network:
        api_host: "{{ ansible_host }}"
        api_user: "{{ pve_api_user }}"
        api_password: "{{ pve_api_password }}"
        node: "{{ inventory_hostname | split('.') | first }}"
        state: apply
      when: pending.has_pending_changes

# ── Play 2 : VLANs sur le switch core NX-OS ───────────────────────────────────
- name: Sync VLANs on core NX-OS switch
  hosts: nxos
  gather_facts: false
  vars:
    # pve_vlans_desired / pve_vlans_to_remove sont définis dans group_vars/pve.yaml.
    # Ansible charge tous les hostvars à l'initialisation — on les lit depuis pve01.
    _pve_vlans_desired: "{{ hostvars[groups['pve'][0]]['pve_vlans_desired'] }}"
    _pve_vlans_to_remove: "{{ hostvars[groups['pve'][0]]['pve_vlans_to_remove'] }}"

  tasks:
    - name: Ensure desired VLANs are present on switch
      cisco.nxos.nxos_vlans:
        config: "{{ _pve_vlans_desired | json_query('[].{vlan_id: id, name: comment}') }}"
        state: merged

    - name: Remove retired VLANs from switch
      cisco.nxos.nxos_vlans:
        config: "{{ _pve_vlans_to_remove | json_query('[].{vlan_id: id}') }}"
        state: deleted
      when: _pve_vlans_to_remove | length > 0
