---
# Provisionne les VMs et déploie BIND9 (autoritative + récursif) sur netservices_dns.
# Rend le fichier de zone event.lanets.ca depuis templates/event.lanets.ca.zone.j2.
# Hôtes : netservices_dns
# Usage : make network/dns

- name: Provision DNS VMs on Proxmox
  hosts: netservices_dns
  gather_facts: false
  become: false
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false
  roles:
    - cedille.proxmox.vm

- name: Deploy netservices DNS
  hosts: netservices_dns
  gather_facts: true
  become: true
  pre_tasks:
    - name: Ensure zone file directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /var/lib/bind
        - /var/cache/bind

    - name: Render event zone file on authoritative pair
      ansible.builtin.template:
        src: templates/event.lanets.ca.zone.j2
        dest: "{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - "{{ netservices_dns.ha.zones[0].master_file }}"
        - "{{ netservices_dns.ha.zones[0].slave_file }}"
  roles:
    - cedille.netservices.dns
