---
# Provisionne la VM et déploie Stork (dashboard de monitoring pour Kea DHCP et BIND9).
# Hôtes : netservices_stork
# Usage : make network/stork

- name: Provision Stork VM on Proxmox
  hosts: netservices_stork
  gather_facts: false
  become: false
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false
  roles:
    - cedille.proxmox.vm

- name: Deploy netservices Stork
  hosts: netservices_stork
  gather_facts: true
  become: true
  roles:
    - cedille.netservices.stork
