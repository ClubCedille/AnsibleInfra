---
- name: Provision DNS VMs on Proxmox
  hosts: netservices_dns
  gather_facts: false
  become: false
  pre_tasks:
    - name: Check SSH reachability before creating the VM
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: "{{ ansible_port | default(22) }}"
        timeout: 3
        state: started
      delegate_to: localhost
      register: netservices_dns_reachability
      ignore_errors: true
      changed_when: false

    - name: Flag VM creation only when host is unreachable
      ansible.builtin.set_fact:
        netservices_dns_create_vm: "{{ netservices_dns_reachability is failed }}"
      changed_when: false
  roles:
    - role: cedille.proxmox.vm
      when: netservices_dns_create_vm | bool

- name: Deploy netservices DNS
  hosts: netservices_dns
  gather_facts: true
  become: true
  pre_tasks:
    - name: Ensure zone file directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /var/lib/bind
        - /var/cache/bind

    - name: Render event zone file on authoritative pair
      ansible.builtin.template:
        src: templates/event.lanets.ca.zone.j2
        dest: "{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - "{{ netservices_dns.ha.zones[0].master_file }}"
        - "{{ netservices_dns.ha.zones[0].slave_file }}"
  roles:
    - cedille.netservices.dns
