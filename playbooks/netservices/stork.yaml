---
- name: Provision Stork VM on Proxmox
  hosts: netservices_stork
  gather_facts: false
  become: false
  module_defaults:
    community.proxmox.proxmox_kvm:
      validate_certs: false
    community.proxmox.proxmox_disk:
      validate_certs: false
  roles:
    - cedille.proxmox.vm

- name: Deploy netservices Stork
  hosts: netservices_stork
  gather_facts: true
  become: true
  roles:
    - cedille.netservices.stork
