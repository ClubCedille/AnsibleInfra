---
# Provisionne les VMs et déploie Kea DHCP4 sur netservices_dhcp (infra permanente, sans validation post-deploy).
# NOTE : préférer infra/dhcp.yaml qui valide la config Kea après déploiement.
# Hôtes : netservices_dhcp
# Usage : make netservices/dhcp

- name: Provision DHCP VMs on Proxmox
  hosts: netservices_dhcp
  gather_facts: false
  become: false
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false
  roles:
    - cedille.proxmox.vm

- name: Deploy netservices DHCP
  hosts: netservices_dhcp
  gather_facts: true
  become: true
  roles:
    - cedille.netservices.dhcp
