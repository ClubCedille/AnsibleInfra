---
# Pointe pip vers le miroir PyPI local (docker_registry_mirror_host, défini
# dans les group_vars de l'inventaire appelant) pour éviter le rate-limit
# PyPI lors d'installs répétées sur les VMs de l'event.

- name: Configure pip proxy
  ansible.builtin.copy:
    content: |
      [global]
      index-url = http://{{ docker_registry_mirror_host }}:3141/root/pypi/+simple/
      trusted-host = {{ docker_registry_mirror_host }}
    dest: /etc/pip.conf
    owner: root
    group: root
    mode: "0644"
  become: true
