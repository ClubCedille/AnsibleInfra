---
# Configure SNMP v2c read-only community sur les switches infra pour le scraping Prometheus.
# La communauté est vaultée dans group_vars/monitoring_exporters.yaml.
# ACL restreint les requêtes SNMP à la VM monitoring uniquement.
#
# État : seule la section NX-OS est active. La section IOS (Cisco 3850) est commentée
# en attente d'une résolution du bug cisco.ios.ios_snmp_server (voir issue upstream).
# Hôtes actifs : nxos
# Usage : make cisco-config/snmp

- name: Configure SNMP on Cisco IOS switches
  hosts: ios
  gather_facts: false
  vars:
    snmp_community: "{{ monitoring_snmp_community }}"
    snmp_acl_v4: SNMP_ALLOW
  tasks:
    - name: Create ACL to restrict SNMP access to monitoring VM
      cisco.ios.ios_acls:
        config:
          - afi: ipv4
            acls:
              - name: SNMP_ALLOW
                aces:
                  - sequence: 10
                    grant: permit
                    source:
                      host: 10.0.21.95
                  - sequence: 20
                    grant: deny
                    source:
                      any: true
        state: merged

    - name: Configure SNMP v2c read-only community
      cisco.ios.ios_snmp_server:
        config:
          communities:
            - name: "{{ snmp_community }}"
              ro: true
              acl_v4: SNMP_ALLOW
        state: merged

- name: Configure SNMP on Cisco NX-OS switch
  hosts: nxos
  gather_facts: false
  vars:
    snmp_community: "{{ monitoring_snmp_community }}"
  tasks:
    - name: Configure SNMP v2c read-only community
      cisco.nxos.nxos_snmp_server:
        config:
          communities:
            - community: "{{ snmp_community }}"
              ro: true
        state: merged
