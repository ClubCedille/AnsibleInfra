---
# One-time migration of the forgejo runner fleet from VLAN21
# (10.0.21.236-244) to the dedicated CI/CD VLAN (tag 40, 10.0.40.0/24,
# renumbered 10.0.40.10-18). Run once hosts.ini/group_vars already
# declare the new IPs/VLAN (the desired end-state) — this playbook is
# what actually makes it true on Proxmox + inside each guest.
#
# serial: 1 — at most one runner offline at a time, never a total outage
# of the CI/CD fleet.
#
# Per host:
#   1. cloud-init clean while still reachable on the OLD IP (VLAN21) —
#      without this, a reboot alone won't make cloud-init re-render
#      netplan from the new ipconfig0/net0 Proxmox hands it; NoCloud
#      only fully re-inits when it doesn't recognize its cached state.
#   2. Stop the VM (full stop, not a soft reboot). Confirmed live,
#      2026-09-10: pushing net0 while the VM is RUNNING silently didn't
#      persist the new VLAN tag (ipconfig0 took effect, net0 didn't),
#      and a state:restarted (guest-level ACPI reboot) afterwards
#      doesn't re-attach the vNIC either — only a genuine stop+start
#      forces Proxmox to re-attach it with the current net0 config.
#   3. Push new net0 (VLAN tag) + ipconfig0 (new IP/gateway) via the API
#      while stopped.
#   4. Start the VM.
#   5. Wait for SSH to come back on the NEW IP (ansible_host already
#      points there from the inventory change).
#
# Usage: ansible-playbook -i inventories/infra/hosts.ini \
#   playbooks/oneoff/network-migrate-forgejo-runners-vlan40.yaml --ask-vault-pass

- name: Migrate forgejo runners to VLAN 40 (CI/CD)
  hosts: forgejo_runners
  gather_facts: false
  serial: 1
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false

  tasks:
    - name: "Clean cloud-init state while still reachable on the old IP"
      # hosts.ini's ansible_host already points at the NEW (VLAN 40) IP —
      # that's the desired end-state, but the VM is still physically on
      # VLAN21 until later tasks run. Old IP follows a fixed pattern
      # (10.0.21.<vm_id mod 1000> — e.g. vm_id 21236 → 10.0.21.236,
      # matching every runner's original VLAN21 address) so it doesn't
      # need a second inventory field just for this one-time migration.
      # Runs over SSH to the guest — must NOT inherit the control
      # machine's venv interpreter used by the delegate_to:localhost
      # Proxmox API tasks below.
      ansible.builtin.command:
        cmd: cloud-init clean --logs
      become: true
      changed_when: true
      vars:
        ansible_host: "10.0.21.{{ (vm_id | int) % 1000 }}"

    - name: "Authenticate to Proxmox API (ticket)"
      # community.proxmox.proxmox_kvm's state:stopped was unreliable here
      # (confirmed live, 2026-09-10: "VM quit/powerdown failed" timeout,
      # VM never actually stopped) — raw API stop/start calls (same ones
      # used to recover the botched first attempt) proved reliable.
      ansible.builtin.uri:
        url: "https://{{ vm_proxmox_api.host }}:8006/api2/json/access/ticket"
        method: POST
        body_format: form-urlencoded
        body:
          username: "{{ vm_proxmox_api.user }}"
          password: "{{ vm_proxmox_api.password }}"
        validate_certs: false
      register: _pve_auth
      delegate_to: localhost
      no_log: true
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: "Stop the VM before changing net0"
      ansible.builtin.uri:
        url: "https://{{ vm_proxmox_api.host }}:8006/api2/json/nodes/{{ vm_proxmox_node }}/qemu/{{ vm_id }}/status/stop"
        method: POST
        headers:
          Cookie: "PVEAuthCookie={{ _pve_auth.json.data.ticket }}"
          CSRFPreventionToken: "{{ _pve_auth.json.data.CSRFPreventionToken }}"
        validate_certs: false
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: "Pause for the stop to fully complete"
      ansible.builtin.pause:
        seconds: 10

    - name: "Look up the VM's actual current node"
      # These runners are HA-managed — confirmed live, 2026-09-10:
      # stopping via the plain qemu status/stop endpoint (rather than
      # the HA-aware path) can trigger Proxmox's HA stack to relocate
      # the VM to a different node as part of its own reconciliation,
      # independent of anything this playbook asked for (kvm02 moved
      # pve01→pve07, dind01 pve01→pve02, dind02 pve01→pve03 just from
      # the stop above). Trusting the static vm_proxmox_node inventory
      # value for the next two tasks would then fail with "config file
      # does not exist" on the stale node. Look up the real one fresh
      # instead of trusting inventory.
      ansible.builtin.uri:
        url: "https://{{ vm_proxmox_api.host }}:8006/api2/json/cluster/resources?type=vm"
        method: GET
        headers:
          Cookie: "PVEAuthCookie={{ _pve_auth.json.data.ticket }}"
        validate_certs: false
      register: _pve_resources
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: "Set actual current node as a fact"
      ansible.builtin.set_fact:
        _actual_node: >-
          {{ (_pve_resources.json.data | selectattr('vmid', 'equalto', vm_id | int) | first).node }}

    - name: "Push new VLAN + static IP to Proxmox (net0/ipconfig0)"
      # THE actual root cause of two failed attempts (confirmed by
      # reading module source, 2026-09-10): proxmox_kvm silently DROPS
      # the `net` param on any update unless update_unsafe:true is
      # explicitly passed — a deliberate safety guard ("don't update
      # disk... and network interface, unless update_unsafe=True"),
      # completely unrelated to VM power state. ipconfig0 was never
      # affected by this (it's not in the guarded list), which is why it
      # kept silently "working" while net0 silently never did.
      community.proxmox.proxmox_kvm:
        api_user: "{{ vm_proxmox_api.user }}"
        api_password: "{{ vm_proxmox_api.password }}"
        api_host: "{{ vm_proxmox_api.host }}"
        vmid: "{{ vm_id }}"
        node: "{{ _actual_node }}"
        net:
          net0: "{{ vm_net.device | default('virtio') }},bridge={{ vm_net.bridge }},tag={{ vm_net.vlan }}"
        ipconfig:
          ipconfig0: "ip={{ vm_net.ip }}/{{ vm_net.netmask }},gw={{ vm_net.gateway }}"
        update: true
        update_unsafe: true
        state: present
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: "Start the VM"
      ansible.builtin.uri:
        url: "https://{{ vm_proxmox_api.host }}:8006/api2/json/nodes/{{ _actual_node }}/qemu/{{ vm_id }}/status/start"
        method: POST
        headers:
          Cookie: "PVEAuthCookie={{ _pve_auth.json.data.ticket }}"
          CSRFPreventionToken: "{{ _pve_auth.json.data.CSRFPreventionToken }}"
        validate_certs: false
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: "Wait for SSH on the new IP (VLAN 40)"
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 180
