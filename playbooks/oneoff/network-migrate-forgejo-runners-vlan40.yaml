---
# One-time migration of forgejo runners from VLAN21 to VLAN40 (CI/CD), making the
# hosts.ini/group_vars end-state true on Proxmox + inside each guest. serial: 1
# (never a total CI/CD outage). Per host: cloud-init clean on old IP, full VM
# stop+start (soft reboot doesn't re-attach the vNIC), push net0/ipconfig0, start, wait SSH.
#
# Usage: make oneoff/network-migrate-forgejo-runners-vlan40

- name: Migrate forgejo runners to VLAN 40 (CI/CD)
  hosts: forgejo_runners
  gather_facts: false
  serial: 1
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false

  tasks:
    - name: "Clean cloud-init state while still reachable on the old IP"
      # ansible_host already points at the NEW IP (end-state); old IP follows a fixed
      # pattern (10.0.21.<vm_id mod 1000>). Must run over SSH, not inherit control venv.
      ansible.builtin.command:
        cmd: cloud-init clean --logs
      become: true
      changed_when: true
      vars:
        ansible_host: "10.0.21.{{ (vm_id | int) % 1000 }}"

    - name: "Authenticate to Proxmox API (ticket)"
      # state:stopped via the module was unreliable (confirmed live, 2026-09-10);
      # raw API stop/start calls proved reliable.
      ansible.builtin.uri:
        url: "https://{{ vm_proxmox_api.host }}:8006/api2/json/access/ticket"
        method: POST
        body_format: form-urlencoded
        body:
          username: "{{ vm_proxmox_api.user }}"
          password: "{{ vm_proxmox_api.password }}"
        validate_certs: false
      register: _pve_auth
      delegate_to: localhost
      no_log: true
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: "Stop the VM before changing net0"
      ansible.builtin.uri:
        url: "https://{{ vm_proxmox_api.host }}:8006/api2/json/nodes/{{ vm_proxmox_node }}/qemu/{{ vm_id }}/status/stop"
        method: POST
        headers:
          Cookie: "PVEAuthCookie={{ _pve_auth.json.data.ticket }}"
          CSRFPreventionToken: "{{ _pve_auth.json.data.CSRFPreventionToken }}"
        validate_certs: false
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: "Pause for the stop to fully complete"
      ansible.builtin.pause:
        seconds: 10

    - name: "Look up the VM's actual current node"
      # HA can relocate the VM to a different node when stopped (confirmed live,
      # 2026-09-10); look up the real node fresh instead of trusting inventory.
      ansible.builtin.uri:
        url: "https://{{ vm_proxmox_api.host }}:8006/api2/json/cluster/resources?type=vm"
        method: GET
        headers:
          Cookie: "PVEAuthCookie={{ _pve_auth.json.data.ticket }}"
        validate_certs: false
      register: _pve_resources
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: "Set actual current node as a fact"
      ansible.builtin.set_fact:
        _actual_node: >-
          {{ (_pve_resources.json.data | selectattr('vmid', 'equalto', vm_id | int) | first).node }}

    - name: "Push new VLAN + static IP to Proxmox (net0/ipconfig0)"
      # Root cause of two failed attempts: proxmox_kvm silently drops `net` on update
      # unless update_unsafe:true is passed (a safety guard, unrelated to power state).
      community.proxmox.proxmox_kvm:
        api_user: "{{ vm_proxmox_api.user }}"
        api_password: "{{ vm_proxmox_api.password }}"
        api_host: "{{ vm_proxmox_api.host }}"
        vmid: "{{ vm_id }}"
        node: "{{ _actual_node }}"
        net:
          net0: "{{ vm_net.device | default('virtio') }},bridge={{ vm_net.bridge }},tag={{ vm_net.vlan }}"
        ipconfig:
          ipconfig0: "ip={{ vm_net.ip }}/{{ vm_net.netmask }},gw={{ vm_net.gateway }}"
        update: true
        update_unsafe: true
        state: present
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: "Start the VM"
      ansible.builtin.uri:
        url: "https://{{ vm_proxmox_api.host }}:8006/api2/json/nodes/{{ _actual_node }}/qemu/{{ vm_id }}/status/start"
        method: POST
        headers:
          Cookie: "PVEAuthCookie={{ _pve_auth.json.data.ticket }}"
          CSRFPreventionToken: "{{ _pve_auth.json.data.CSRFPreventionToken }}"
        validate_certs: false
      delegate_to: localhost
      vars:
        ansible_python_interpreter: "{{ ansible_playbook_python }}"

    - name: "Wait for SSH on the new IP (VLAN 40)"
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 180
