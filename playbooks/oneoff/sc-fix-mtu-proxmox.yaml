---
# Correctif one-shot : force mtu=1 (héritage depuis le bridge Proxmox) sur net0 de toutes les VMs SC.
# Utile si des VMs ont été créées avec un MTU fixe incompatible avec le trunk réseau de l'event.
# Délègue `qm set` au nœud Proxmox hébergeant chaque VM.
# Hôtes : all:!pve:!switch:!ctfd
# Usage : make sc/fix-mtu-proxmox

- name: Set mtu=1 (inherit from bridge) on all Proxmox VM network interfaces
  hosts: "all:!pve:!switch:!ctfd"
  gather_facts: false
  tasks:
    - name: Set net0 mtu=1 via qm set on the Proxmox node
      ansible.builtin.command:
        cmd: >-
          qm set {{ vm_id }}
          --net0 {{ vm_net.device | default('virtio') }},bridge={{ vm_net.bridge }},tag={{ vm_net.vlan | default('1') }},mtu={{ vm_net.mtu | default(1500) }}
      delegate_to: "{{ vm_proxmox_node }}.mgmt.etsmtl.club"
      when: vm_id is defined and vm_net is defined
      changed_when: true
