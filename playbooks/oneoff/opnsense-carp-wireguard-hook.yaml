---
# Bootstrap fix for "can't reach opnsense02 from the VPN": the stock os-wireguard CARP
# hook never stops WireGuard on BACKUP, so wg0 runs active-active and the backup
# swallows reply traffic meant for the master. Uses plain SSH (not the API, which
# this fix unblocks). Standalone bootstrap; long-term fix lives in AnsibleRoles.
#
# Usage:
#   make oneoff/opnsense-carp-wireguard-hook

- name: Fix WireGuard CARP transition hook on both routers
  hosts: routers
  gather_facts: false
  connection: ssh

  tasks:
    - name: "Backup existing WireGuard hook before replacing"
      ansible.builtin.command:
        cmd: cp /usr/local/etc/rc.syshook.d/carp/20-wireguard /usr/local/etc/rc.syshook.d/carp/20-wireguard.pre-ansible-fix
        creates: /usr/local/etc/rc.syshook.d/carp/20-wireguard.pre-ansible-fix

    - name: "Deploy corrected WireGuard CARP transition hook"
      ansible.builtin.copy:
        dest: /usr/local/etc/rc.syshook.d/carp/20-wireguard
        owner: root
        group: wheel
        mode: "0755"
        content: |
          #!/bin/sh
          # Managed by Ansible, see playbooks/oneoff/opnsense-carp-wireguard-hook.yaml
          # and AnsibleRoles opnsense/roles/config/templates/carp-wireguard-hook.sh.j2
          # for the full diagnosis. Args: $1 = subsystem ("vhid@interface"),
          # $2 = event type (MASTER/BACKUP/INIT).
          #
          # Validated live 2026-09-09: BACKUP must bring wg0 down + drop its /32 peer
          # routes and route back to the peer via master; MASTER re-enables wg0.

          WG_IF="wg0"
          PEER_LAN_IP="{{ opnsense_peer_lan_ip }}"
          VPN_POOL_NET="{{ opnsense_wireguard_pool_net | default('10.254.0.0/24') }}"
          subsystem="$1"
          type="$2"

          case "$type" in
            MASTER)
              route delete -net "$VPN_POOL_NET" "$PEER_LAN_IP" >/dev/null 2>&1
              ifconfig "$WG_IF" up
              configctl -dq wireguard configure
              ;;
            BACKUP)
              ifconfig "$WG_IF" down
              netstat -rn -f inet \
                | awk -v ifn="$WG_IF" '$NF == ifn && $3 ~ /H/ && $1 !~ /\// {print $1}' \
                | while read -r peer_ip; do
                    route delete -host "$peer_ip" -iface "$WG_IF" >/dev/null 2>&1
                  done
              route add -net "$VPN_POOL_NET" "$PEER_LAN_IP" >/dev/null 2>&1
              ;;
            INIT)
              configctl -dq wireguard configure
              ;;
            *)
              logger -t carp-wireguard-hook "unknown CARP event type '$type' from '$subsystem'"
              ;;
          esac
      register: _hook_deploy

    - name: "Show current CARP state for context (informational only)"
      ansible.builtin.shell:
        cmd: set -o pipefail && ifconfig | grep -B2 carp | grep -E "^[a-z]|carp:"
      register: _carp_state
      changed_when: false

    - name: "Current CARP state"
      ansible.builtin.debug:
        msg: "{{ _carp_state.stdout_lines }}"
