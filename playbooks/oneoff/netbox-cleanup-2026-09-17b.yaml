---
# Deuxième remédiation ponctuelle du 2026-09-17, suite à correction des
# préfixes VLAN (voir group_vars/pve.yaml) :
#
#   1. Les 4 anciens prefixes des VLANs événementiels (10.110/120/130/
#      140.0.0/16) sont remplacés par les vrais (10.66-69.0.0/16, cf.
#      netbox_prefix corrigé sur les VLANs 66-69). Les anciens ne sont pas
#      réutilisés (CIDR différent, pas juste un renommage), supprimés.
#
#   2. VLANs 310/320/330/340 ("EVENT - ...") : ancien schéma de
#      numérotation événementiel abandonné, remplacé par 66-69. Supprimés.
#
#   3. VLANs dupliquées (même vid que l'entrée ansible-managed, legacy
#      site=None) : Management(21), DMZ(247), Services(500), k8s03(1003),
#      k8s09(1009), k8s10(1010). Vérifié avant suppression qu'aucune
#      interface de device physique ne les référence (untagged_vlan/
#      tagged_vlans), aucun membre orphelin après coup. Le seul prefix
#      qui pointait sur l'une d'elles (142.137.247.0/24 -> DMZ) a déjà été
#      réassigné à "wan" automatiquement par sync_vlans.yaml (le module
#      netbox_prefix matche par valeur de CIDR, pas par VLAN).
#
# Playbook à usage unique, IDs figés au moment de l'audit (2026-09-17),
# à ne pas relancer tel quel après application.
#
# Usage :
#   make oneoff/netbox-cleanup-2026-09-17b

- name: One-time NetBox cleanup (stale event prefixes, retired VLANs, duplicates)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    netbox_headers:
      Authorization: "Token {{ netbox_api_token }}"
    stale_prefix_ids:
      - 19 # 10.110.0.0/16 (event-client) -- remplacé par 10.66.0.0/16
      - 20 # 10.120.0.0/16 (event-ap-mgmt) -- remplacé par 10.67.0.0/16
      - 21 # 10.130.0.0/16 (event-dns-ctf) -- remplacé par 10.68.0.0/16
      - 22 # 10.140.0.0/16 (event-additionnel) -- remplacé par 10.69.0.0/16
    retired_vlan_ids:
      - 13 # EVENT - Access (310)
      - 14 # EVENT - Management (320)
      - 15 # EVENT - Wireless (330)
      - 16 # Event - Contingence (340)
    duplicate_vlan_ids:
      - 1 # Management (21) -- doublon de lan-management
      - 2 # DMZ (247) -- doublon de wan
      - 17 # Services (500) -- doublon de k8s-services
      - 5 # k8s03 (1003) -- doublon de k8s-cedille-sandbox
      - 11 # k8s09 (1009) -- doublon de k8s-shared
      - 12 # k8s10 (1010) -- doublon de k8s-cedille-production-v2

  tasks:
    - name: Delete stale event prefixes (wrong CIDR, replaced)
      ansible.builtin.uri:
        url: "{{ netbox_api_url }}/api/ipam/prefixes/{{ item }}/"
        method: DELETE
        headers: "{{ netbox_headers }}"
        status_code: [204, 404]
      loop: "{{ stale_prefix_ids }}"
      loop_control:
        label: "prefix id={{ item }}"

    - name: Delete retired event-numbering VLANs (310-340)
      ansible.builtin.uri:
        url: "{{ netbox_api_url }}/api/ipam/vlans/{{ item }}/"
        method: DELETE
        headers: "{{ netbox_headers }}"
        status_code: [204, 404]
      loop: "{{ retired_vlan_ids }}"
      loop_control:
        label: "vlan id={{ item }}"

    - name: Delete duplicate legacy VLANs (superseded by ansible-managed equivalents)
      ansible.builtin.uri:
        url: "{{ netbox_api_url }}/api/ipam/vlans/{{ item }}/"
        method: DELETE
        headers: "{{ netbox_headers }}"
        status_code: [204, 404]
      loop: "{{ duplicate_vlan_ids }}"
      loop_control:
        label: "vlan id={{ item }}"
