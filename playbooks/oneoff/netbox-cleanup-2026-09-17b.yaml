---
# Deuxième remédiation ponctuelle du 2026-09-17 : remplace les 4 anciens prefixes VLAN
# événementiels (10.110-140/16) par les vrais (10.66-69/16), supprime les VLANs
# 310-340 (ancien schéma) et les VLANs dupliquées legacy (21/247/500/1003/1009/1010).
# Playbook à usage unique, IDs figés au moment de l'audit : ne pas relancer tel quel.
#
# Usage :
#   make oneoff/netbox-cleanup-2026-09-17b

- name: One-time NetBox cleanup (stale event prefixes, retired VLANs, duplicates)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    netbox_headers:
      Authorization: "Token {{ netbox_api_token }}"
    stale_prefix_ids:
      - 19 # 10.110.0.0/16 (event-client) -- remplacé par 10.66.0.0/16
      - 20 # 10.120.0.0/16 (event-ap-mgmt) -- remplacé par 10.67.0.0/16
      - 21 # 10.130.0.0/16 (event-dns-ctf) -- remplacé par 10.68.0.0/16
      - 22 # 10.140.0.0/16 (event-additionnel) -- remplacé par 10.69.0.0/16
    retired_vlan_ids:
      - 13 # EVENT - Access (310)
      - 14 # EVENT - Management (320)
      - 15 # EVENT - Wireless (330)
      - 16 # Event - Contingence (340)
    duplicate_vlan_ids:
      - 1 # Management (21) -- doublon de lan-management
      - 2 # DMZ (247) -- doublon de wan
      - 17 # Services (500) -- doublon de k8s-services
      - 5 # k8s03 (1003) -- doublon de k8s-cedille-sandbox
      - 11 # k8s09 (1009) -- doublon de k8s-shared
      - 12 # k8s10 (1010) -- doublon de k8s-cedille-production-v2

  tasks:
    - name: Delete stale event prefixes (wrong CIDR, replaced)
      ansible.builtin.uri:
        url: "{{ netbox_api_url }}/api/ipam/prefixes/{{ item }}/"
        method: DELETE
        headers: "{{ netbox_headers }}"
        status_code: [204, 404]
      loop: "{{ stale_prefix_ids }}"
      loop_control:
        label: "prefix id={{ item }}"

    - name: Delete retired event-numbering VLANs (310-340)
      ansible.builtin.uri:
        url: "{{ netbox_api_url }}/api/ipam/vlans/{{ item }}/"
        method: DELETE
        headers: "{{ netbox_headers }}"
        status_code: [204, 404]
      loop: "{{ retired_vlan_ids }}"
      loop_control:
        label: "vlan id={{ item }}"

    - name: Delete duplicate legacy VLANs (superseded by ansible-managed equivalents)
      ansible.builtin.uri:
        url: "{{ netbox_api_url }}/api/ipam/vlans/{{ item }}/"
        method: DELETE
        headers: "{{ netbox_headers }}"
        status_code: [204, 404]
      loop: "{{ duplicate_vlan_ids }}"
      loop_control:
        label: "vlan id={{ item }}"
