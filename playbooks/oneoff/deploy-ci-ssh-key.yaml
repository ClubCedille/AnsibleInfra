---
# One-shot : ajoute la clé publique CI (additif, jamais exclusive) sur les VMs déjà
# provisionnées avant son introduction (2026-09-17). Pour les VMs futures, portée par
# vm_sshkeys/cloud-init (group_vars/all.yaml) : ce playbook ne sert qu'au rattrapage.
# Whitelist explicite de hosts SSH classiques (exclut Talos/IPMI/switches/event LANETS).
#
# Usage :
#   make oneoff/deploy-ci-ssh-key DRY_RUN=1                    # --check --diff
#   make oneoff/deploy-ci-ssh-key LIMIT=pve                    # sous-ensemble
#   make oneoff/deploy-ci-ssh-key                               # run réel
#
# Prérequis : être authentifié avec une clé déjà trustée sur les cibles
# (bootstrap via l'agent SSH de l'opérateur).

- name: Déployer la clé publique SSH CI sur les hôtes standards
  hosts: "pve:nas:routers:pnp-server:netservices_dhcp:k8s_poc_dhcp:omni:jumpbox:monitoring_core:forgejo_runners:github_runners:eclipse:dci_vms"
  gather_facts: false

  tasks:
    - name: Ajouter la clé publique CI (additif)
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        state: present
        key: "{{ lookup('file', playbook_dir ~ '/../../files/ssh/ansibleinfra_ci.pub') }}"
