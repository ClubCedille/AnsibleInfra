---
# Provision + déploie le portail captif nginx (challenge #5 — flag caché dans le HTML).
# Accessible via http://portal.ctf/ pointé par l'option DHCP 114 (captive-portal URI).
# Hôtes : http_portal
# Usage : make sc/http-portal

- name: Provision portal VM on Proxmox
  hosts: http_portal
  gather_facts: false
  become: false
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false
  roles:
    - cedille.proxmox.vm

- name: Wait for SSH on portal VM
  hosts: http_portal
  gather_facts: false
  tasks:
    - name: Wait for SSH to be available
      ansible.builtin.wait_for_connection:
        timeout: 120

- name: Deploy HTTP portal
  hosts: http_portal
  gather_facts: true
  become: true
  vars_files:
    - vars/flags.yml
  pre_tasks:
    - name: Configure pkgcache apt mirror
      ansible.builtin.include_role:
        name: cedille.pkgcache.apt
  vars:
    nginx_portal_html_template: "{{ playbook_dir }}/templates/http_portal.html.j2"
  roles:
    - cedille.netservices.nginx_portal
