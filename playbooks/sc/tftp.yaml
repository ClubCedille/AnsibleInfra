---
# OBSOLÈTE — ne pas utiliser pour le challenge DHCP SummerCamp.
# Le TFTP est désormais co-localisé sur les VMs DHCP et déployé via sc/dhcp.yaml
# (rôle cedille.netservices.tftp). Le groupe netservices_tftp (.41-.42) existe encore
# dans l'inventaire mais n'est pas utilisé.

- name: Provision TFTP VMs on Proxmox
  hosts: netservices_tftp
  gather_facts: false
  become: false
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false
  roles:
    - cedille.proxmox.vm

- name: Wait for SSH on TFTP VMs
  hosts: netservices_tftp
  gather_facts: false
  tasks:
    - name: Wait for SSH to be available
      ansible.builtin.wait_for_connection:
        timeout: 120

- name: Deploy TFTP
  hosts: netservices_tftp
  gather_facts: true
  become: true
  pre_tasks:
    - name: Configure apt proxy
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../includes/apt_proxy.yaml"
  roles:
    - cedille.netservices.tftp
