---
# Provision + déploie les challenges par-équipe (groupe `chall`) : VM Proxmox → Docker Compose
# + node_exporter + docker_state_exporter. Peut cibler 600-700+ VMs simultanément.
# L'archive node_exporter est téléchargée une seule fois via le controller (anti-rate-limit GitHub).
# Hôtes : chall
# Usage : make sc/chall [LIMIT=<challenge>]

- name: Provision Challenge VMs on Proxmox
  hosts: chall
  gather_facts: false
  become: false
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false
  roles:
    - cedille.proxmox.vm

- name: Wait for SSH on Challenge VMs
  hosts: chall
  gather_facts: false
  tasks:
    - name: Wait for SSH to be available
      ansible.builtin.wait_for_connection:
        timeout: 120

- name: Install the docker role on this VM
  hosts: chall
  gather_facts: true
  become: true
  pre_tasks:
    - name: Wait for DNS to be functional
      ansible.builtin.command:
        cmd: nslookup archive.ubuntu.com
      retries: 10
      delay: 5
      register: dns_check
      until: dns_check.rc == 0
      changed_when: false
    - name: Configure apt proxy
      ansible.builtin.include_tasks: includes/apt_proxy.yaml
    - name: Configure pip proxy
      ansible.builtin.include_tasks: includes/pip_proxy.yaml
  roles:
    - cedille.docker.install
  post_tasks:
    - name: Pull the latest images for the challenge
      community.docker.docker_compose_v2_pull:
        project_src: "{{ install_docker_compose_target_dir }}"
      notify: Recreate containers

  handlers:
    - name: Recreate containers
      community.docker.docker_compose_v2:
        project_src: "{{ install_docker_compose_target_dir }}"
        state: present

- name: Deploy Docker container state exporter on Challenge VMs
  hosts: chall
  gather_facts: true
  become: true
  pre_tasks:
    # IMPORTANT (scale: this group can grow to 600-700+ VMs as more per-team
    # challenges are added): delegate_to: localhost + run_once: true means
    # GitHub is hit exactly ONCE for the whole play, regardless of host count.
    # The archive is then pushed host-by-host over SSH (copy). The role's own
    # "Download Node Exporter archive" get_url task targets this exact same
    # dest path — since the file already exists with a matching checksum, it
    # short-circuits locally and never re-downloads from GitHub. Do NOT remove
    # this staging step or per-host count growth will start tripping GitHub's
    # unauthenticated rate limit (60 req/h per source IP).
    - name: Ensure local archive staging directory exists  # noqa: run-once[task]
      ansible.builtin.file:
        path: /tmp/monitoring-archives
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true
      become: false

    - name: Download node_exporter archive on controller  # noqa: run-once[task]
      ansible.builtin.get_url:
        url: "{{ node_exporter_install.archive_url }}"
        dest: "/tmp/monitoring-archives/{{ node_exporter_install.archive_name }}"
        mode: "0644"
      delegate_to: localhost
      run_once: true
      become: false

    - name: Ensure remote archive download directory exists
      ansible.builtin.file:
        path: "{{ node_exporter_paths.archive_download_dir }}"
        state: directory
        mode: "0755"

    - name: Push node_exporter archive to host
      ansible.builtin.copy:
        src: "/tmp/monitoring-archives/{{ node_exporter_install.archive_name }}"
        dest: "{{ node_exporter_paths.archive_download_dir }}/{{ node_exporter_install.archive_name }}"
        mode: "0644"

  roles:
    - cedille.monitoring.node_exporter
    - cedille.monitoring.docker_state_exporter

  post_tasks:
    # cedille.monitoring.node_exporter service unit template has a trim_blocks bug:
    # when node_exporter_extra_args is empty, Restart=on-failure gets concatenated
    # to the --collector.textfile.directory argument, causing node_exporter to hang.
    - name: Fix node_exporter service unit
      ansible.builtin.copy:
        dest: "{{ node_exporter_paths.service_unit }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          After=network-online.target
          Wants=network-online.target

          [Service]
          User={{ node_exporter_service.user }}
          Group={{ node_exporter_service.group }}
          ExecStart={{ node_exporter_paths.binary_dir }}/node_exporter \
            --collector.textfile.directory={{ node_exporter_paths.textfile_collector_dir }}
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart Node Exporter
      become: true
