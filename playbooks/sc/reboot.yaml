---
# Hard-stop + redémarrage de toutes les VMs SC via l'API Proxmox (exclut pve/switch/ctfd).
# Utile pour appliquer un changement kernel ou résoudre un état figé en masse.
# Hôtes : all:!pve:!switch:!ctfd
# Usage : make sc/reboot [LIMIT=<groupe>]

- name: Hard-stop and reboot all VMs via Proxmox API
  hosts: "all:!pve:!switch:!ctfd"
  gather_facts: false
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false
      api_user: "{{ vm_proxmox_api.user }}"
      api_password: "{{ vm_proxmox_api.password }}"
      api_host: "{{ vm_proxmox_api.host }}"
  tasks:
    - name: Hard-stop VM  # noqa: args[module]
      community.proxmox.proxmox_kvm:
        vmid: "{{ vm_id }}"
        node: "{{ vm_proxmox_node }}"
        state: stopped
        force: true
      delegate_to: localhost
      when: vm_id is defined

    - name: Wait 30 seconds before starting VMs  # noqa: run-once[task]
      ansible.builtin.pause:
        seconds: 30
      run_once: true

    - name: Start VM  # noqa: args[module]
      community.proxmox.proxmox_kvm:
        vmid: "{{ vm_id }}"
        node: "{{ vm_proxmox_node }}"
        state: started
      delegate_to: localhost
      when: vm_id is defined

    - name: Wait for SSH to come back up
      ansible.builtin.wait_for_connection:
        timeout: 120
        delay: 10
