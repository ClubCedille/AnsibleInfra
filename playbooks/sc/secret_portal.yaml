---
- name: Provision secret portal VM on Proxmox
  hosts: secret_portal
  gather_facts: false
  become: false
  module_defaults:
    community.proxmox.proxmox_kvm:
      validate_certs: false
    community.proxmox.proxmox_disk:
      validate_certs: false
  roles:
    - cedille.proxmox.vm

- name: Wait for SSH on secret portal VM
  hosts: secret_portal
  gather_facts: false
  tasks:
    - name: Wait for SSH to be available
      ansible.builtin.wait_for_connection:
        timeout: 120

- name: Deploy secret portal
  hosts: secret_portal
  gather_facts: true
  become: true
  pre_tasks:
    - name: Configure apt proxy
      ansible.builtin.include_tasks: includes/apt_proxy.yaml
  vars:
    nginx_portal_html_template: "{{ playbook_dir }}/templates/secret_portal.html.j2"
  roles:
    - cedille.netservices.nginx_portal
