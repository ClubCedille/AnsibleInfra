---
# Provision + déploie le portail secret nginx (secret.ctf — page narrative du scénario CTF).
# Hôtes : secret_portal
# Usage : make sc/secret_portal

- name: Provision secret portal VM on Proxmox
  hosts: secret_portal
  gather_facts: false
  become: false
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false
  roles:
    - cedille.proxmox.vm

- name: Wait for SSH on secret portal VM
  hosts: secret_portal
  gather_facts: false
  tasks:
    - name: Wait for SSH to be available
      ansible.builtin.wait_for_connection:
        timeout: 120

- name: Deploy secret portal
  hosts: secret_portal
  gather_facts: true
  become: true
  pre_tasks:
    - name: Configure pkgcache apt mirror
      ansible.builtin.include_role:
        name: cedille.pkgcache.apt
  vars:
    nginx_portal_html_template: "{{ playbook_dir }}/templates/secret_portal.html.j2"
  roles:
    - cedille.netservices.nginx_portal
