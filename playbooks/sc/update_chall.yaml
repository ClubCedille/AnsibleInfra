---
# Met à jour un challenge par-équipe : pull des nouvelles images, down (volumes inclus), up.
# Utiliser --limit pour cibler un challenge ou une équipe spécifique.
# Hôtes : chall
# Usage : make sc/update_chall LIMIT=<challenge>

- name: Update a per-team challenge instance (docker compose pull + down/up, volumes inclus)
  hosts: chall
  gather_facts: false
  become: true
  tasks:
    - name: Pull the latest images for the challenge
      community.docker.docker_compose_v2_pull:
        project_src: "{{ install_docker_compose_target_dir }}"

    - name: Tear down the challenge's docker compose project (containers + volumes)
      community.docker.docker_compose_v2:
        project_src: "{{ install_docker_compose_target_dir }}"
        state: absent
        remove_volumes: true

    - name: Bring the challenge's docker compose project back up (fresh volumes, updated image)
      community.docker.docker_compose_v2:
        project_src: "{{ install_docker_compose_target_dir }}"
        state: present
