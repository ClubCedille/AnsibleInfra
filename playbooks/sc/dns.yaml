---
# Provision + déploie BIND9 (zones .ctf et .camp) pour l'event CTF.
# Charge les flags depuis roles/kea/vars/flags.yml (flag #9 → TXT record sur secret.ctf).
# Hôtes : netservices_dns (inventaire SC)
# Usage : make sc/dns

- name: Provision DNS VMs on Proxmox
  hosts: netservices_dns
  gather_facts: false
  become: false
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false
  roles:
    - cedille.proxmox.vm

- name: Wait for SSH on DNS VMs
  hosts: netservices_dns
  gather_facts: false
  tasks:
    - name: Wait for SSH to be available
      ansible.builtin.wait_for_connection:
        timeout: 120

- name: Deploy DNS
  hosts: netservices_dns
  gather_facts: true
  become: true
  vars_files:
    - ../../roles/kea/vars/flags.yml
  pre_tasks:
    - name: Configure apt proxy
      ansible.builtin.include_tasks: includes/apt_proxy.yaml
    - name: Configure pip proxy
      ansible.builtin.include_tasks: includes/pip_proxy.yaml
  roles:
    - cedille.netservices.dns
