---
# Provision + déploie les VMs ShellCTF (challenge shell basé sur SSH par mot de passe).
# Active PasswordAuthentication dans sshd via le rôle cedille.proxmox.pwdssh.
# Hôtes : shellctf
# Usage : make sc/shellctf

- name: Provision ShellCTF VMs on Proxmox
  hosts: shellctf
  gather_facts: false
  become: false
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false
  roles:
    - cedille.proxmox.vm

- name: Wait for SSH on ShellCTF VMs
  hosts: shellctf
  gather_facts: false
  tasks:
    - name: Wait for SSH to be available
      ansible.builtin.wait_for_connection:
        timeout: 120

- name: Enable password communication for ssh
  hosts: shellctf
  gather_facts: true
  become: true
  pre_tasks:
    - name: Wait for DNS to be functional
      ansible.builtin.command:
        cmd: nslookup archive.ubuntu.com
      retries: 10
      delay: 5
      register: dns_check
      until: dns_check.rc == 0
      changed_when: false
    - name: Configure pkgcache apt mirror
      ansible.builtin.include_role:
        name: cedille.pkgcache.apt
    - name: Configure pip proxy
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../includes/pip_proxy.yaml"
  roles:
    - cedille.proxmox.pwdssh
