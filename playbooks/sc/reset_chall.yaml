---
- name: Reset a per-team challenge instance (docker compose down/up, volumes inclus)
  hosts: chall
  gather_facts: false
  become: true
  tasks:
    - name: Tear down the challenge's docker compose project (containers + volumes)
      community.docker.docker_compose_v2:
        project_src: "{{ install_docker_compose_target_dir }}"
        state: absent
        remove_volumes: true

    - name: Bring the challenge's docker compose project back up (fresh volumes)
      community.docker.docker_compose_v2:
        project_src: "{{ install_docker_compose_target_dir }}"
        state: present
