---
# Remet à zéro un challenge par-équipe : docker compose down (volumes inclus) puis up.
# Efface toute la progression de l'équipe sur ce challenge. Utiliser --limit pour cibler une équipe.
# Hôtes : chall
# Usage : make sc/reset_chall LIMIT=<equipe>

- name: Reset a per-team challenge instance (docker compose down/up, volumes inclus)
  hosts: chall
  gather_facts: false
  become: true
  tasks:
    - name: Tear down the challenge's docker compose project (containers + volumes)
      community.docker.docker_compose_v2:
        project_src: "{{ install_docker_compose_target_dir }}"
        state: absent
        remove_volumes: true

    - name: Bring the challenge's docker compose project back up (fresh volumes)
      community.docker.docker_compose_v2:
        project_src: "{{ install_docker_compose_target_dir }}"
        state: present
