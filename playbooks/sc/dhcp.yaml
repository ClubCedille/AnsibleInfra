---
# Provision + déploie Kea DHCP4 CTF (flags dans options 15/43/114/119) et TFTP co-localisé.
# Charge les flags depuis playbooks/sc/vars/flags.yml. Valide la config Kea avant redémarrage.
# Hôtes : netservices_dhcp (inventaire SC)
# Usage : make sc/dhcp

- name: Provision DHCP VMs on Proxmox
  hosts: netservices_dhcp
  gather_facts: false
  become: false
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false
  roles:
    - cedille.proxmox.vm

- name: Wait for SSH on DHCP VMs
  hosts: netservices_dhcp
  gather_facts: false
  tasks:
    - name: Wait for SSH to be available
      ansible.builtin.wait_for_connection:
        timeout: 120

- name: Deploy CTF DHCP
  hosts: netservices_dhcp
  gather_facts: true
  become: true
  vars_files:
    - vars/flags.yml
  pre_tasks:
    - name: Configure pkgcache apt mirror
      ansible.builtin.include_role:
        name: cedille.pkgcache.apt
  vars:
    tftp_extra_files:
      - src: "{{ playbook_dir }}/../../files/sc/pxe/netboot.ipxe"
        dest: netboot.ipxe
      - src: "{{ playbook_dir }}/../../files/sc/pxe/bzImage"
        dest: bzImage
      - src: "{{ playbook_dir }}/../../files/sc/pxe/initrd"
        dest: initrd
  roles:
    - cedille.netservices.dhcp
    - cedille.netservices.tftp
  post_tasks:
    - name: Validate Kea config
      ansible.builtin.command:
        cmd: kea-dhcp4 -t /etc/kea/kea-dhcp4.conf
      changed_when: false
