---
# Synchronise dans NetBox les interfaces réseau (VLAN, IP) de chaque VM du groupe
# virtual_machines, lues directement depuis l'inventaire Ansible (vm_nets/vm_net
# dans les hostvars), sans fichier vars/ séparé à maintenir en parallèle.
#
# Pré-requis : playbooks/netbox/sync_vms.yaml doit avoir tourné avant (les
# VMs doivent exister dans NetBox).
#
# Usage :
#   make netbox/sync_vm_interfaces

- name: Sync NetBox VM interfaces/IPs from vm_net/vm_nets (Ansible inventory)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    netbox_site_name: "ets-d"

  tasks:
    - name: Sync interfaces for each VM in the virtual_machines group
      ansible.builtin.include_tasks: tasks/sync_vm_nics.yaml
      loop: "{{ groups['virtual_machines'] }}"
      loop_control:
        loop_var: vm_name
        label: "{{ vm_name }}"
