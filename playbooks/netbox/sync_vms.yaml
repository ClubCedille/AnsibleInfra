---
# Synchronise dans NetBox les VMs du groupe virtual_machines (hosts.ini) : l'inventaire
# Ansible est la source de vérité, pas de liste dupliquée. Devices physiques déjà
# mappés à la main, hors scope ici. Tourne sur localhost (pas par host) pour éviter
# les 503 API dus aux connexions parallèles (voir `forks` dans ansible.cfg).
#
# Usage :
#   make netbox/sync_vms
#   make netbox/sync_vms DRY_RUN=1

- name: Sync NetBox Virtual Machines from Ansible inventory (infra)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    netbox_cluster_name: "OneBigCluster"

  tasks:
    - name: Sync one Virtual Machine per host in the virtual_machines group
      netbox.netbox.netbox_virtual_machine:
        netbox_url: "{{ netbox_api_url }}"
        netbox_token: "{{ netbox_api_token }}"
        data:
          name: "{{ item }}"
          cluster: "{{ netbox_cluster_name }}"
          status: active
          tags:
            - ansible-managed
            - permanent
        state: present
      loop: "{{ groups['virtual_machines'] }}"
      loop_control:
        label: "{{ item }}"
