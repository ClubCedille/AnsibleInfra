---
# Source de vérité : inventories/infra/group_vars/pve.yaml -> pve_vlans_desired
# (c'est la liste réellement maintenue par Ansible sur le trunk PVE, plus à jour
# que docs/VLANRegistry.md qui date de juin 2026 et ne connaît pas encore 40/45/48/1300).
#
# Exclus volontairement du périmètre NetBox (décision 2026-09-17) :
#   - 30   : VLAN de provisionnement day-0 des switches, hors périmètre IPAM.
#   - 601  : cluster k3s k3s-m0x/k3s-w0x, gateway jamais identifiée, absent de
#            pve_vlans_desired -> pas géré par Ansible, donc pas de vérité à
#            synchroniser.
#   - 2206 : lien direct infrastructure ÉTS, géré côté ÉTS, hors périmètre club.
#
# tag: "permanent" (infra club à demeure) ou "event" (track événementiel/CTF,
# recréé/détruit à chaque édition — cf. playbooks/sc/*.yaml).
#
# prefix: null quand aucun sous-réseau IP n'est routé sur ce VLAN (lien L2 dédié,
# segment WAN partagé, ou segmentation VLAN21 encore en chantier) — zone grise
# à clarifier avant de considérer NetBox comme fiable à 100% sur ces VLANs.

netbox_vlans:
  - id: 15
    name: "ceph-storage"
    comment: "CEPH - MTU 9216"
    tag: permanent
    prefix: null

