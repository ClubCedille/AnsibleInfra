---
# Synchronise dans NetBox les VLANs/prefixes déclarés par pve_vlans_desired
# (group_vars/pve.yaml), la même source que network/update-vlans.yaml qui les crée
# réellement sur PVE. netbox_api_token est un token NetBox v1 classique (pas le
# format v2 "Bearer nbt_..."), incompatible avec les modules netbox.netbox (pynetbox).
#
# Usage :
#   make netbox/sync_vlans
#   make netbox/sync_vlans DRY_RUN=1

- name: Sync NetBox VLANs/prefixes from pve_vlans_desired (Ansible source of truth)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    netbox_site_name: "ets-d"
    # Lu depuis n'importe quel host du groupe [pve] (hostvars déjà chargés),
    # même idiome que playbooks/network/update-vlans.yaml.
    _pve_vlans_desired: "{{ hostvars[groups['pve'][0]]['pve_vlans_desired'] }}"
    # VLANs à synchroniser dans NetBox : celles avec netbox_ignore non défini/false.
    netbox_vlans: "{{ _pve_vlans_desired | rejectattr('netbox_ignore', 'defined') | list + _pve_vlans_desired | selectattr('netbox_ignore', 'defined') | rejectattr('netbox_ignore') | list }}"

  tasks:
    - name: Ensure ansible-managed tags exist
      netbox.netbox.netbox_tag:
        netbox_url: "{{ netbox_api_url }}"
        netbox_token: "{{ netbox_api_token }}"
        data:
          name: "{{ item }}"
        state: present
      loop:
        - ansible-managed
        - permanent
        - event

    - name: Sync VLANs
      netbox.netbox.netbox_vlan:
        netbox_url: "{{ netbox_api_url }}"
        netbox_token: "{{ netbox_api_token }}"
        data:
          name: "{{ item.netbox_name | default(item.comment) }}"
          vid: "{{ item.id }}"
          site: "{{ netbox_site_name }}"
          description: "{{ item.comment }}"
          tags:
            - ansible-managed
            - "{{ item.netbox_tag | default('permanent') }}"
        state: present
      loop: "{{ netbox_vlans }}"
      loop_control:
        label: "VLAN {{ item.id }} ({{ item.netbox_name | default(item.comment) }})"

    - name: Sync prefixes for VLANs with a known CIDR
      netbox.netbox.netbox_prefix:
        netbox_url: "{{ netbox_api_url }}"
        netbox_token: "{{ netbox_api_token }}"
        data:
          prefix: "{{ item.netbox_prefix }}"
          scope_type: "dcim.location"
          scope: "D2021"
          vlan: "{{ item.netbox_name | default(item.comment) }}"
          description: "{{ item.comment }}"
          tags:
            - ansible-managed
            - "{{ item.netbox_tag | default('permanent') }}"
        state: present
      loop: "{{ netbox_vlans | selectattr('netbox_prefix', 'defined') | list }}"
      loop_control:
        label: "Prefix {{ item.netbox_prefix }} (VLAN {{ item.id }})"
