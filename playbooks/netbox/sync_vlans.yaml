---
# Synchronise dans NetBox l'état des VLANs/prefixes tel que déclaré par Ansible.
#
# Source de vérité : vars/vlans.yml, lui-même dérivé de
# inventories/infra/group_vars/pve.yaml (pve_vlans_desired) — voir les
# commentaires de ce fichier pour le détail des VLANs exclus (30, 601, 2206).
#
# Usage :
#   make netbox/sync_vlans VAULT_PASSWORD_FILE=~/Cedille/.vault
#   make netbox/sync_vlans VAULT_PASSWORD_FILE=~/Cedille/.vault DRY_RUN=1  # --check --diff
#
# netbox_api_url / netbox_api_token viennent de
# inventories/infra/group_vars/all.yaml (token vaulté). netbox_api_token est
# un token NetBox v1 classique (40 caractères quand en clair) — pas le nouveau
# format v2 "Bearer nbt_<key>.<secret>" : les modules netbox.netbox
# (pynetbox) envoient "Authorization: Token <valeur>", incompatible avec le
# schéma v2.
#
# Premier incrément du sync Ansible -> NetBox : VLANs + prefixes seulement.
# Devices (pve/switches/routers) et Virtual Machines viendront dans des
# playbooks séparés (sync_devices.yaml, sync_vms.yaml).

- name: Sync NetBox VLANs/prefixes from Ansible source of truth
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars/vlans.yml
  vars:
    netbox_site_name: "ets-d"
    netbox_location_name: "D2021"

  tasks:
    - name: Ensure ansible-managed tags exist
      netbox.netbox.netbox_tag:
        netbox_url: "{{ netbox_api_url }}"
        netbox_token: "{{ netbox_api_token }}"
        data:
          name: "{{ item }}"
        state: present
      loop:
        - ansible-managed
        - permanent
        - event

    - name: Sync VLANs
      netbox.netbox.netbox_vlan:
        netbox_url: "{{ netbox_api_url }}"
        netbox_token: "{{ netbox_api_token }}"
        data:
          name: "{{ item.name }}"
          vid: "{{ item.id }}"
          site: "{{ netbox_site_name }}"
          description: "{{ item.comment }}"
          tags:
            - ansible-managed
            - "{{ item.tag }}"
        state: present
      loop: "{{ netbox_vlans }}"
      loop_control:
        label: "VLAN {{ item.id }} ({{ item.name }})"

    - name: Sync prefixes for VLANs with a known CIDR
      netbox.netbox.netbox_prefix:
        netbox_url: "{{ netbox_api_url }}"
        netbox_token: "{{ netbox_api_token }}"
        data:
          prefix: "{{ item.prefix }}"
          scope_type: "dcim.location"
          scope: "{{ netbox_location_name }}"
          vlan: "{{ item.name }}"
          description: "{{ item.comment }}"
          tags:
            - ansible-managed
            - "{{ item.tag }}"
        state: present
      loop: "{{ netbox_vlans | selectattr('prefix') | list }}"
      loop_control:
        label: "Prefix {{ item.prefix }} (VLAN {{ item.id }})"
