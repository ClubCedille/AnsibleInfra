---
# Rapport en lecture seule de l'état actuel de NetBox — ne modifie rien.
# Sert à valider ce qui existe déjà avant de synchroniser devices/VMs, pour
# éviter d'écraser du travail de mapping manuel déjà fait (ex. devices PVE).
#
# Usage :
#   make netbox/report VAULT_PASSWORD_FILE=~/Cedille/.vault
#
# Écrit un JSON consolidé dans /tmp/netbox_report.json (jamais affiché en
# clair dans les logs — les tâches HTTP utilisent no_log pour éviter de
# faire fuiter le token dans la sortie Ansible).

- name: Read-only report of current NetBox state
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    netbox_endpoints:
      sites: dcim/sites
      manufacturers: dcim/manufacturers
      device_types: dcim/device-types
      device_roles: dcim/device-roles
      devices: dcim/devices
      racks: dcim/racks
      platforms: dcim/platforms
      cluster_types: virtualization/cluster-types
      clusters: virtualization/clusters
      virtual_machines: virtualization/virtual-machines
      vlans: ipam/vlans
      prefixes: ipam/prefixes
      ip_addresses: ipam/ip-addresses

  tasks:
    - name: Query each NetBox endpoint
      ansible.builtin.uri:
        url: "{{ netbox_api_url }}/api/{{ item.value }}/?limit=200"
        headers:
          Authorization: "Token {{ netbox_api_token }}"
        return_content: true
      register: netbox_query
      no_log: true
      loop: "{{ netbox_endpoints | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Build consolidated report
      ansible.builtin.set_fact:
        netbox_report: "{{ netbox_report | default({}) | combine({item.item.key: (item.json.results | default([]))}) }}"
      loop: "{{ netbox_query.results }}"
      loop_control:
        label: "{{ item.item.key }}"
      no_log: true

    - name: Write report to disk
      ansible.builtin.copy:
        content: "{{ netbox_report | to_nice_json }}"
        dest: /tmp/netbox_report.json
        mode: "0600"

    - name: Summary counts (safe to display)
      ansible.builtin.debug:
        msg: "{{ item.key }}: {{ item.value | length }}"
      loop: "{{ netbox_report | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
