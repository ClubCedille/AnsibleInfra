---
# Déploie Grafana Alloy (log shipping) sur les hôtes PVE et NAS (infra permanente).
# Pousse les logs système/PVE/Ceph vers Loki sur 10.0.21.95:3100.
# Hôtes : monitoring_alloy
# Usage : make monitoring/infra-alloy

- name: Deploy Alloy log shipping on PVE and NAS hosts
  hosts: monitoring_alloy
  gather_facts: true
  become: true
  vars:
    alloy_loki_endpoints:
      - name: infra_loki
        url: "http://10.0.21.95:3100/loki/api/v1/push"
    alloy_file_sources:
      - name: system_logs
        paths:
          - /var/log/syslog
          - /var/log/auth.log
          - /var/log/*.log
        labels:
          job: system
          env: infra
      - name: pve_logs
        paths:
          - /var/log/pve/*.log
          - /var/log/pve-firewall.log
        labels:
          job: pve
          env: infra
      - name: ceph_logs
        paths:
          - /var/log/ceph/*.log
        labels:
          job: ceph
          env: infra
  roles:
    - cedille.monitoring.alloy
