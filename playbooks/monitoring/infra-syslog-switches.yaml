---
# Déploie Grafana Alloy sur monitoring01 en mode récepteur syslog. Un seul
# Alloy tourne sur monitoring01 (un seul config.alloy possible), donc TOUTES
# les sources syslog du site sont déclarées ici, pas seulement les switches
# malgré le nom du fichier -- inclut maintenant le cluster CARP OPNsense
# (opnsense01/02), voir infra-opnsense.yaml pour la configuration côté
# OPNsense (destination syslog distante, rôle cedille.monitoring.opnsense_syslog).
# Filtre en allowlist pour les switches : ne garde que les événements
# interfaces/port-channel/STP (voir la conf "logging server" sur le switch
# lui-même, appliquée manuellement). Pas de filtre pour OPNsense (system +
# firewall + CARP/HA -- portée volontairement large, voir README du rôle
# opnsense_syslog).
# Pousse vers Loki centralisé dans k8s-shared (voir k8s-shared#429/#430) --
# mêmes identifiants BasicAuth que infra-alloy.yaml (Vault kv/data/
# monitoring/default/loki-push-htpasswd, username "alloy").
# Hôtes : monitoring_core
# Usage : make monitoring/infra-syslog-switches

- name: Deploy Alloy syslog receiver on monitoring01
  hosts: monitoring_core
  gather_facts: true
  become: true
  vars:
    # NX-OS (7.0.3.I6(2) sur data01) émet un syslog non conforme RFC3164
    # ("<189>: 2026 Sep 2 18:24:04 UTC: %VSHD-..." — deux-points + année sur
    # 4 chiffres juste après le PRI), rejeté silencieusement par le parser
    # rfc3164 (aucune erreur nulle part, juste zéro donnée dans Loki — root
    # cause trouvée en confirmant par tcpdump qu'un paquet réel arrivait
    # bien côté réseau). "raw" évite le parsing d'en-tête entièrement — on
    # n'a besoin que du contenu du message pour le filtre allowlist.
    alloy_custom_args:
      - "--stability.level=experimental"
    monitoring_loki_password: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      64363037346364313763656362363133383538653937633935626133636338373634343436303139
      6633346333323936343031643264333564363164343563650a366536346137373039323236363563
      63363362613331306137386433313837653865643035326630336330623435316165373635333637
      6635326439646463380a396362363932353666353334616339623337373034353330643962366635
      33306331373062396134376439363863383034336336386466373461636163656635356239343131
      3165313631653863376563346233366634353734646262363163
    alloy_loki_endpoints:
      - name: infra_loki
        url: "https://loki.etsmtl.club/loki/api/v1/push"
        basic_auth:
          username: alloy
          password: "{{ monitoring_loki_password }}"
    alloy_syslog_sources:
      - name: core01
        listen_address: "0.0.0.0:514"
        protocol: udp
        syslog_format: raw
        labels:
          job: switch
          instance: data01
          env: infra
        # Interfaces (up/down/flap, transceivers), port-channels, STP —
        # tout le reste du syslog de data01 est jeté (voir stage.drop).
        keep_regex: "(?P<interesting>%ETHPORT-|%ETH_PORT_CHANNEL-|%STP-)"

      # OPNsense — un port dédié par nœud (voir host_vars
      # opnsense_syslog_alloy_port) car config.alloy.j2 applique un jeu de
      # labels STATIQUE par listener : deux nœuds sur un seul port seraient
      # indistinguables dans Loki (voir README du rôle opnsense_syslog).
      #
      # ⚠ Format non vérifié empiriquement (voir README opnsense_syslog
      # "État de validation") -- rfc3164 est un pari raisonnable (OPNsense
      # utilise syslog-ng avec framing legacy/BSD par défaut, rfc5424=false
      # côté destination), mais data01/NX-OS a déjà démontré qu'un firmware
      # peut émettre un framing non conforme que rfc3164 rejette
      # silencieusement (zéro erreur nulle part, juste zéro donnée). Avant de
      # faire confiance à ces deux sources : vérifier
      # loki_source_syslog_entries_total / _parsing_errors_total sur
      # monitoring01:12345/metrics après un peu de trafic réel. Si ça reste à
      # zéro malgré des paquets confirmés (tcpdump port 5140/5141), basculer
      # syslog_format en "raw" comme pour data01 -- rien à changer côté
      # OPNsense pour ce fallback.
      - name: opnsense01
        listen_address: "0.0.0.0:5140"
        protocol: udp
        syslog_format: rfc3164
        labels:
          job: opnsense
          instance: opnsense01
          env: infra
        # Pas d'allowlist -- portée volontairement large (system + firewall
        # + CARP/HA), voir README du rôle opnsense_syslog. keep_regex reste
        # requis par le template (boucle for inconditionnelle) : "." matche
        # toute ligne non vide, donc ne filtre rien en pratique.
        keep_regex: "(?P<interesting>.)"

      - name: opnsense02
        listen_address: "0.0.0.0:5141"
        protocol: udp
        syslog_format: rfc3164
        labels:
          job: opnsense
          instance: opnsense02
          env: infra
        keep_regex: "(?P<interesting>.)"
  roles:
    - cedille.monitoring.alloy
