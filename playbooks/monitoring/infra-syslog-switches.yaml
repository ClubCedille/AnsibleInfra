---
# Déploie Grafana Alloy sur monitoring01 en mode récepteur syslog (seule instance,
# donc TOUTES les sources syslog du site sont ici : switches + cluster CARP OPNsense,
# voir infra-opnsense.yaml). Allowlist pour les switches, portée large pour OPNsense.
# Pousse vers Loki centralisé dans k8s-shared (mêmes identifiants qu'infra-alloy.yaml).
# Hôtes : monitoring_core
# Usage : make monitoring/infra-syslog-switches

- name: Deploy Alloy syslog receiver on monitoring01
  hosts: monitoring_core
  gather_facts: true
  become: true
  vars:
    # NX-OS émet un syslog non conforme RFC3164, rejeté silencieusement (zéro
    # donnée dans Loki). "raw" évite le parsing d'en-tête, on garde juste le message.
    alloy_custom_args:
      - "--stability.level=experimental"
    monitoring_loki_password: !vault |
      $ANSIBLE_VAULT;1.1;AES256
      64363037346364313763656362363133383538653937633935626133636338373634343436303139
      6633346333323936343031643264333564363164343563650a366536346137373039323236363563
      63363362613331306137386433313837653865643035326630336330623435316165373635333637
      6635326439646463380a396362363932353666353334616339623337373034353330643962366635
      33306331373062396134376439363863383034336336386466373461636163656635356239343131
      3165313631653863376563346233366634353734646262363163
    alloy_loki_endpoints:
      - name: infra_loki
        url: "https://loki.etsmtl.club/loki/api/v1/push"
        basic_auth:
          username: alloy
          password: "{{ monitoring_loki_password }}"
    alloy_syslog_sources:
      - name: core01
        listen_address: "0.0.0.0:514"
        protocol: udp
        syslog_format: raw
        labels:
          job: switch
          instance: data01
          env: infra
        # Interfaces (up/down/flap, transceivers), port-channels, STP :
        # tout le reste du syslog de data01 est jeté (voir stage.drop).
        keep_regex: "(?P<interesting>%ETHPORT-|%ETH_PORT_CHANNEL-|%STP-)"

      # Port dédié par nœud (labels statiques par listener, voir host_vars
      # opnsense_syslog_alloy_port). Si zéro donnée malgré trafic confirmé, basculer en "raw".
      - name: opnsense01
        listen_address: "0.0.0.0:5140"
        protocol: udp
        syslog_format: rfc3164
        labels:
          job: opnsense
          instance: opnsense01
          env: infra
        # Pas d'allowlist, portée volontairement large (system + firewall + CARP/HA).
        # keep_regex requis par le template ; "." matche tout, ne filtre rien ici.
        keep_regex: "(?P<interesting>.)"

      - name: opnsense02
        listen_address: "0.0.0.0:5141"
        protocol: udp
        syslog_format: rfc3164
        labels:
          job: opnsense
          instance: opnsense02
          env: infra
        keep_regex: "(?P<interesting>.)"
  roles:
    - cedille.monitoring.alloy
