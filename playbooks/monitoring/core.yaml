---
# Provisionne la VM de monitoring (event SC) et déploie Loki + Alertmanager + Prometheus + Grafana.
# Pour la stack infra permanente, utiliser monitoring/infra-core.yaml.
# Hôtes : monitoring_core
# Usage : make monitoring/core

- name: Provision monitoring VM on Proxmox
  hosts: monitoring_core
  gather_facts: false
  become: false
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false
  roles:
    - cedille.proxmox.vm

- name: Deploy core monitoring stack
  hosts: monitoring_core
  gather_facts: true
  become: true
  roles:
    - cedille.monitoring.loki
    - cedille.monitoring.alertmanager
    - cedille.monitoring.prometheus
    - cedille.monitoring.grafana
