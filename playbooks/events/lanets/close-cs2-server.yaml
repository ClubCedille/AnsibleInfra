---
# Arrête le serveur CS2 (LanETS) proprement via le rôle lanets.cs2.close_server.
# Hôtes : cs2
# Usage : make events/lanets/close-cs2-server

- name: Closing cs2 server
  hosts: cs2
  tasks:
    - name: Closing cs2 server
      ansible.builtin.include_role:
        name: lanets.cs2.close_server
