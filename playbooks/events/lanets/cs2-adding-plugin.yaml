---
# Installe un plugin CounterStrike sur le serveur CS2 (LanETS).
# Hôtes : cs2

- name: Adding plugin to cs2 server
  hosts: cs2
  module_defaults:
    ansible.builtin.get_url:
      timeout: 300
  tasks:
    - name: Adding plugin to cs2 server
      ansible.builtin.include_role:
        name: lanets.cs2.plugin_cs2
