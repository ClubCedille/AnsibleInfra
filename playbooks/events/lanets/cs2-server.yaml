---
# Déploie CS2 Server Manager et prépare un serveur CS2.
# Hôtes : cs2
# Usage : make events/lanets/cs2-server

- name: Deploying the CS2 server with CS2 Server Manager
  hosts: cs2
  become: true
  tasks:
    - name: Install CS2 Server Manager and bootstrap CS2
      ansible.builtin.include_role:
        name: lanets.cs2.server_manager
      vars:
        cs2_server_manager_rcon_password: "{{ cs2_rcon_password }}"
