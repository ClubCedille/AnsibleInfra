---
# Provisioning DHCP VLAN 67 : 2 VMs Ubuntu, Kea DHCP4 hot-standby HA, réplique le pool
# "AP-MGMT" du WLC Cisco (10.67.0.0/16, option 43 AP-manager).
# INCOMPLET : le groupe [vlan67_dhcp] n'est pas déclaré dans hosts.ini (voir [vlan66_dhcp]
# pour le modèle) ; ce playbook n'a donc aucun hôte à cibler pour l'instant.
#
# Prérequis :
#   - VLAN 67 existant sur les hôtes Proxmox (network/update-vlans.yaml)
#   - Image Ubuntu disponible : /var/lib/vz/images/lanets/ubuntu_2404.img
#
# Usage :
#   make events/vlan67-dhcp

- name: Provision DHCP VMs for VLAN 67
  hosts: vlan67_dhcp
  gather_facts: false
  become: false
  module_defaults:
    group/community.proxmox.proxmox:
      validate_certs: false
  roles:
    - cedille.proxmox.vm

# - name: Wait for SSH on DHCP VMs
#   hosts: vlan67_dhcp
#   gather_facts: false
#   tasks:
#     - name: Wait for SSH to be available
#       ansible.builtin.wait_for_connection:
#         timeout: 300

- name: Deploy Kea DHCP on VLAN 67 DHCP VMs
  hosts: vlan67_dhcp
  gather_facts: true
  become: true
  roles:
    - cedille.netservices.dhcp
  post_tasks:
    - name: Validate Kea config
      ansible.builtin.command:
        cmd: kea-dhcp4 -t /etc/kea/kea-dhcp4.conf
      changed_when: false
