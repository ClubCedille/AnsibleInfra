# ansible_host = IP interne Talos (VLAN 500, DHCP), pour référence uniquement.
# Les playbooks de resize/provisioning ciblent l'API Proxmox via vm_id/vm_proxmox_node
# (host_vars), pas ces hosts en SSH direct (gather_facts: false, delegate_to: localhost).
# ansible_host vide = IP pas encore attribuée (nodes pas encore provisionnés).
