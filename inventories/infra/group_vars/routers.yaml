---
# Shared configuration for all OPNsense routers (opnsense01/02.prod.etsmtl.club).
# Per-node values (vm_net.ip, vm_is_master, ha device/peer IPs) are in host_vars.

ansible_user: root
# SSH used for: escape-hatch interface provisioning, diff playbook classic rules read.
# opnsense-config.yaml overrides connection to local (API calls from control machine).
ansible_connection: ssh

# HA sync interface — dedicated NIC vtnet2, subnet 10.255.254.252/30
opnsense_ha_interface: "opt15"
opnsense_ha_peer_net: "10.255.254.252/30"

# CARP shared password — same across all VIPs on both nodes.
# To vault: ansible-vault encrypt_string '<password>' --name vip_password
vip_password: !vault |
  # VAULT_PLACEHOLDER — replace with: ansible-vault encrypt_string '...' --name vip_password
  CHANGE_ME

# XMLRPC sync credentials (used by hasync_general on the master node).
# To vault: ansible-vault encrypt_string '<password>' --name vm_password
vm_user: root
vm_password: !vault |
  # VAULT_PLACEHOLDER — replace with: ansible-vault encrypt_string '...' --name vm_password
  CHANGE_ME

# VLAN trunk — all VLANs on vtnet0, shared between both nodes.
# VLAN 247 (vtnet0_vlan247): WAN delivery VLAN managed at Proxmox/switch level —
# intentionally not managed by this role. Candidate for removal from OPNsense config.
vm_net_trunk:
  vlans:
    - id: 21
      interface_name: lan
      vip: "10.0.21.1"
      mask: 24
      network: "10.0.21.0"
      parent_nic: vtnet0

    - id: 1003
      interface_name: opt3
      vip: "10.10.1.129"
      mask: 25
      network: "10.10.1.128"
      parent_nic: vtnet0

    - id: 500
      interface_name: opt5
      vip: "10.5.0.1"
      mask: 24
      network: "10.5.0.0"
      parent_nic: vtnet0

    - id: 1009
      interface_name: opt10
      vip: "10.5.9.1"
      mask: 24
      network: "10.5.9.0"
      parent_nic: vtnet0

    - id: 1010
      interface_name: opt13
      vip: "10.5.10.1"
      mask: 24
      network: "10.5.10.0"
      parent_nic: vtnet0

    - id: 65
      interface_name: opt14
      vip: null
      mask: 30
      network: "10.255.255.252"
      parent_nic: vtnet0
