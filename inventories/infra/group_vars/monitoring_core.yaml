# kv/data/monitoring/default/mimir-push-htpasswd (generated by
# terraform/monitoring/push-auth-vault, already applied).
monitoring_mimir_url: https://mimir.etsmtl.club/api/v1/push
monitoring_mimir_username: prometheus
monitoring_mimir_password: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  61383232666639633533626266376431383332393039346337336165626639353539626365623236
  6664626438353132666637396431383832656531323337640a343930323236326630616131383363
  37336439373334386336663636636265343866376265666532306133623064363065626335663863
  3038353137313962340a326230376336383931353237316162653065633731633834353163346436
  33303961313762633634626366336436623631313066386665313661336166383334643639323966
  3436333137383365343431613135383933343834313432353531

# PVE API credentials for prometheus-pve-exporter
monitoring_pve_api_user: "root@pam"
monitoring_pve_api_password: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  35366363353730653863343336626166373062353862333663333938616435646366663634383937
  3130643638353764616465303232663464393363326537380a323132613438356437613033346661
  30316437636363616239663464313031666238663734383834386364353265653831333735373138
  6637343630323164610a353264313763343439313761343462353031623433393664356266613437
  6463

# IPMI credentials for iLO/iDRAC (used by ipmi_exporter)
monitoring_ipmi_username: admin
monitoring_ipmi_password: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  35366363353730653863343336626166373062353862333663333938616435646366663634383937
  3130643638353764616465303232663464393363326537380a323132613438356437613033346661
  30316437636363616239663464313031666238663734383834386364353265653831333735373138
  6637343630323164610a353264313763343439313761343462353031623433393664356266613437
  6463

# ─── Loki ────────────────────────────────────────────────────────────────────
loki_server:
  http_listen_port: 3100
  retention_period: 720h # 30 days
  bind_address: 0.0.0.0

loki_storage:
  path_prefix: /var/lib/loki
  filesystem:
    chunks_directory: /var/lib/loki/chunks
    rules_directory: /var/lib/loki/rules
  schema_config:
    index_prefix: index_

# ─── Alertmanager ─────────────────────────────────────────────────────────────
# Slack webhook URL — vault-encrypt and switch receiver to "slack" when ready
# monitoring_alertmanager_slack_webhook_url: !vault |
#   $ANSIBLE_VAULT;...

alertmanager_route:
  receiver: drop
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

alertmanager_receivers:
  - name: drop
# Uncomment when Slack webhook is configured:
# - name: slack
#   webhook_configs:
#     - url: "{{ monitoring_alertmanager_slack_webhook_url }}"

# ─── Prometheus ───────────────────────────────────────────────────────────────
prometheus_server:
  scrape_interval: 60s
  evaluation_interval: 60s
  retention_time: 30d
  # remote_write receiver enabled so OPNsense Telegraf can push here
  extra_flags:
    - "--web.enable-remote-write-receiver"
  external_labels:
    environment: infra
    cluster: etsmtl

# remote_write to Mimir (k8s-shared) — additive, local Prometheus retention
# (30d, see prometheus_config above) is untouched. Also covers the
# OPNsense Telegraf remote_write receiver below: anything ingested into
# this Prometheus, scraped or pushed, gets relayed onward from here.
prometheus_remote_write:
  - name: mimir
    url: "{{ monitoring_mimir_url }}"
    basic_auth:
      username: "{{ monitoring_mimir_username }}"
      password: "{{ monitoring_mimir_password }}"

prometheus_rule_files: []

prometheus_alerting:
  alertmanagers:
    - targets:
        - 127.0.0.1:9093

prometheus_scrape_configs:
  # ── Self-monitoring ─────────────────────────────────────────────────────────
  - job_name: prometheus
    targets: ["127.0.0.1:9090"]

  - job_name: alertmanager
    targets: ["127.0.0.1:9093"]

  - job_name: loki
    targets: ["127.0.0.1:3100"]

  # ── PVE hosts — node_exporter ──────────────────────────────────────────────
  - job_name: pve_node_exporter
    targets:
      - "10.0.21.51:9100" # pve01
      - "10.0.21.52:9100" # pve02
      - "10.0.21.53:9100" # pve03
      - "10.0.21.54:9100" # pve04
      - "10.0.21.55:9100" # pve05
      - "10.0.21.56:9100" # pve06
      - "10.0.21.57:9100" # pve07
      - "10.0.21.58:9100" # pve08

  # ── NAS — node_exporter ────────────────────────────────────────────────────
  - job_name: nas_node_exporter
    targets:
      - "10.0.21.50:9100" # nas01

  # ── PVE hosts — smartctl_exporter (S.M.A.R.T. disques) ─────────────────────
  - job_name: pve_smartctl_exporter
    targets:
      - "10.0.21.51:9633" # pve01
      - "10.0.21.52:9633" # pve02
      - "10.0.21.53:9633" # pve03
      - "10.0.21.54:9633" # pve04
      - "10.0.21.55:9633" # pve05
      - "10.0.21.56:9633" # pve06
      - "10.0.21.57:9633" # pve07
      - "10.0.21.58:9633" # pve08

  # ── NAS — smartctl_exporter (S.M.A.R.T. disques) ───────────────────────────
  - job_name: nas_smartctl_exporter
    targets:
      - "10.0.21.50:9633" # nas01

  # ── GarageHQ — native /metrics on admin port ───────────────────────────────
  # Requires GarageHQ admin API to listen on 0.0.0.0 (see garage.toml [admin])
  # Token = admin_token from /etc/garage.toml on nas01 — vault-encrypt it in
  # monitoring_core.yaml as monitoring_garage_admin_token
  - job_name: garagehq
    authorization:
      credentials: !vault |
        $ANSIBLE_VAULT;1.1;AES256
        37663463613432636433653938333333333664386262636636306135326138376465623134333437
        6238353633633430626135643938363261613562303061300a386630373762373238313137356339
        39353062393037663065333936306135313230623839633762663435323439613130646131376464
        3337306666386331370a313831313030636230346630383965396561333264636237313861346461
        34333337346138313065316163653833373162646364393032346537303965656466663730346138
        6565336437313037613330326461343765306163356135316437
    targets:
      - "10.0.21.50:3903"

  # ── PVE cluster — prometheus-pve-exporter (port 9221) ─────────────────────
  # Scrapes PVE API for cluster/node/VM/CT/Ceph metrics
  - job_name: pve_cluster
    metrics_path: /pve
    params:
      module: [default]
      cluster: ["1"]
      node: ["1"]
    targets:
      - "10.0.21.51" # pve01
      - "10.0.21.52" # pve02
      - "10.0.21.53" # pve03
      - "10.0.21.54" # pve04
      - "10.0.21.55" # pve05
      - "10.0.21.56" # pve06
      - "10.0.21.57" # pve07
      - "10.0.21.58" # pve08
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "localhost:9221"

  # ── IPMI — iLO (HP, pve01-04 + pve07) ─────────────────────────────────────
  - job_name: ipmi_ilo
    metrics_path: /ipmi
    scrape_interval: 120s
    scrape_timeout: 90s
    params:
      module: [default]
    targets:
      - "10.0.21.41" # pve01 iLO
      - "10.0.21.42" # pve02
      - "10.0.21.43" # pve03
      - "10.0.21.44" # pve04
      - "10.0.21.47" # pve07
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "localhost:9290"

  # ── IPMI — iDRAC (Dell, pve05-06 + pve08) ──────────────────────────────────
  - job_name: ipmi_idrac
    metrics_path: /ipmi
    scrape_interval: 120s
    scrape_timeout: 90s
    params:
      module: [default]
    targets:
      - "10.0.21.45" # pve05 iDRAC
      - "10.0.21.46" # pve06
      - "10.0.21.48" # pve08
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "localhost:9290"

  # ── IPMI — NAS BMC ─────────────────────────────────────────────────────────
  - job_name: ipmi_nas
    metrics_path: /ipmi
    scrape_interval: 120s
    scrape_timeout: 90s
    params:
      module: [default]
    targets:
      - "10.0.21.91" # nasmgmt01
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "localhost:9290"

  # ── Ceph cluster — native MGR Prometheus module (port 9283) ──────────────
  # Only the active MGR responds; scraping all nodes auto-follows MGR failover.
  - job_name: ceph
    scrape_interval: 60s
    metrics_path: /metrics
    targets:
      - "10.0.21.51:9283" # pve01
      - "10.0.21.52:9283" # pve02
      - "10.0.21.53:9283" # pve03
      - "10.0.21.54:9283" # pve04
      - "10.0.21.55:9283" # pve05
      - "10.0.21.56:9283" # pve06
      - "10.0.21.57:9283" # pve07
      - "10.0.21.58:9283" # pve08

  # ── OPNsense — os-telegraf native Prometheus exporter (pull, port 9273) ────
  # Pull-based, not remote_write: os-telegraf has no remote_write output (see
  # AnsibleRoles monitoring/roles/opnsense_telegraf README). Scraped here like
  # every other exporter in this file; prometheus_remote_write below carries
  # it onward to Mimir same as everything else.
  - job_name: opnsense_telegraf
    scrape_interval: 60s
    targets:
      - "10.0.21.2:9273" # opnsense01
      - "10.0.21.3:9273" # opnsense02

  # ── SNMP — Cisco IOS switch (management.prod.lanets.ca) ────────────────────
  - job_name: snmp_ios_switches
    metrics_path: /snmp
    scrape_timeout: 30s
    params:
      module: [if_mib, cisco_device]
      auth: [infra_v2]
    targets:
      - "10.0.21.21" # management.prod.lanets.ca
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "localhost:9116"

  # ── SNMP — Cisco NX-OS switch (data01) ─────────────────────────────────────
  - job_name: snmp_nxos_switches
    metrics_path: /snmp
    params:
      module: [if_mib, cisco_device]
      auth: [infra_v2]
    targets:
      - "10.0.21.11" # data01
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "localhost:9116"

  # ── Blackbox — ICMP probes ─────────────────────────────────────────────────
  - job_name: blackbox_icmp_pve
    metrics_path: /probe
    params:
      module: [icmp]
    targets:
      - "10.0.21.51"
      - "10.0.21.52"
      - "10.0.21.53"
      - "10.0.21.54"
      - "10.0.21.55"
      - "10.0.21.56"
      - "10.0.21.57"
      - "10.0.21.58"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "localhost:9115"

  - job_name: blackbox_icmp_infra
    metrics_path: /probe
    params:
      module: [icmp]
    targets:
      - "10.0.21.11" # data01
      - "10.0.21.31" # axs01
      - "10.0.21.32" # mgmt01
      - "10.0.21.50" # nas01
      - "142.137.247.141" # opnsense01
      - "142.137.247.142" # opnsense02
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "localhost:9115"

# ─── Grafana ──────────────────────────────────────────────────────────────────
grafana_server:
  http_port: 3000
  root_url: "http://monitoring01.mgmt.etsmtl.club:3000"

grafana_datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    is_default: true
    editable: false
  - name: Loki
    type: loki
    access: proxy
    url: http://127.0.0.1:3100
    is_default: false
    editable: false
