      61613838343263353662643033653836656131663637313035666233303736356238
  mirrors:
    - name: debian-base
      origin: ftp.debian.org/debian
      suites: >-
        {{ ansible_distribution_release }}
        {{ ansible_distribution_release }}-updates
      components: main contrib non-free non-free-firmware
      signed_by: /usr/share/keyrings/debian-archive-keyring.gpg
    - name: debian-security
      origin: security.debian.org/debian-security
      suites: "{{ ansible_distribution_release }}-security"
      components: main contrib non-free non-free-firmware
      signed_by: /usr/share/keyrings/debian-archive-keyring.gpg

pve_trunk_bridge: vmbr1

# VLANs à maintenir actifs (sub-interfaces PVE host).
#
# netbox_name / netbox_tag / netbox_prefix / netbox_ignore sont consommés
# uniquement par playbooks/netbox/sync_vlans.yaml (source de vérité unique
# pour le trunk PVE ET pour NetBox — pas de liste dupliquée).
#   - netbox_ignore: true   -> VLAN exclu du sync NetBox (day-0 bootstrap,
#     lien direct ÉTS hors périmètre club, etc. — décision 2026-09-17).
#   - netbox_tag: "event"   -> track événementiel/CTF, recréé/détruit à
#     chaque édition (défaut "permanent" si omis).
#   - netbox_prefix         -> CIDR routé sur ce VLAN, si applicable (VLANs
#     sans prefix classique -- liens L2, segments partagés -- l'omettent).
pve_vlans_desired:
  - id: 15
    comment: "CEPH - MTU 9216"
    mtu: 9216
    netbox_name: "ceph-storage"
    netbox_prefix: "10.0.15.0/24"
  - id: 21
    comment: "LAN management"
    netbox_name: "lan-management"
    netbox_prefix: "10.0.21.0/24"
  - id: 30
