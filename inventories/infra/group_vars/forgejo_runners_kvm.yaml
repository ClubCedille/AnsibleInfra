---
# Pool "KVM/Packer" : exécution host-native avec accès /dev/kvm, pour les
# jobs de build d'image (Packer/QEMU). Pattern déjà en place sur forgejo-runner03.
vm_disk_size: "60G"

forgejo_runner_labels:
  - "kvm-runner:host"

# Builds longs (~10+ min) et CPU/IO heavy : un seul à la fois par box.
forgejo_runner_capacity: 1

forgejo_runner_extra_groups:
  - kvm

forgejo_runner_extra_packages:
  - qemu-guest-agent
  - qemu-system-x86
  - qemu-utils
  - ovmf
