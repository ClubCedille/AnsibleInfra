---
ansible_user: localadmin

vm_cpu_cores: 8
vm_memory_mb: 16384
vm_disk_size: "40G"

vm_disk_image_path: "/var/lib/vz/images/lanets/ubuntu_2404.img"
vm_disk_storage: "RBD_Common"
vm_disk_format: "raw"
vm_disk_device: "virtio0"
vm_cloud_init_storage: "RBD_Common"

vm_delete_if_exists: false
vm_start_after_creation: true
vm_onboot: true

# No pull-through registry mirror on the mgmt network, runners pull directly
# from upstream registries.
docker_registry_mirror_enabled: false

# cedille.docker.install always runs "docker compose up", which fails on an
# empty "services: {}" project ("no service selected"); give it a noop idle service.
install_docker_compose_source_type: inline
install_docker_compose_content: |
  services:
    noop:
      image: alpine:3
      command: ["tail", "-f", "/dev/null"]
      restart: unless-stopped

vm_name: "{{ inventory_hostname }}"
# Placement de départ réparti sur 3 nœuds (pas d'historique existant à respecter,
# contrairement à Forgejo) ; à ajuster si un nœud finit déséquilibré.
vm_proxmox_node: "{{ ['pve01', 'pve02', 'pve03'][(vm_id | int) % 3] }}"

# Créés directement sur le VLAN CI/CD (tag 40), contrairement à Forgejo qui
# existait déjà sur VLAN21 avant la segmentation et a dû être migrée.
vm_net:
  mac: "{{ vm_mac }}"
  bridge: "vmbr1"
  vlan: "40"
  device: virtio
  ip: "{{ ansible_host }}"
  netmask: "24"
  gateway: "10.0.40.1"
  nameservers: "1.1.1.1,8.8.8.8"
  search_domain: "mgmt.etsmtl.club"

vm_proxmox_api:
  user: "root@pam"
  password: !vault |
    $ANSIBLE_VAULT;1.1;AES256
    38616663323566326538653235663137303731356666336338303339616164366637373438663366
    3664396432356165363735646236376238633331373332300a356532353031656264333035303939
    61653665626562323564346563336463393633663231653063616566353961353434363338353531
    6333623135383336610a343532623531353331643164353261666333663637643437383861373161
    3564
  host: "10.0.21.51"

# Organisation GitHub cible pour l'enregistrement des runners.
github_runner_org: "ClubCedille"

# Un groupe par pool (voir github_runner_group dans les group_vars par pool),
# même visibilité que "Default" : repos privés/internes, pas publics.
github_runner_groups_desired:
  - name: "generic"
    visibility: "all"
    allows_public_repositories: false
  - name: "kvm"
    visibility: "all"
    allows_public_repositories: false
  - name: "dind"
    visibility: "all"
    allows_public_repositories: false

# Jeton admin (registration-token + runner-groups API), jamais utilisé par un
# runner. Scope admin:org requis : manage_runners:org seul ne suffit pas (testé 2026-09-17).
github_runner_admin_token: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          35613230653037666530623039396339393731333566346462376437646665393731363437663033
          3261653565386535393365623433383534656235383739300a646439333665626530643766363930
          31353738396139656330326339306534316365303164363838323761353062333966656161656230
          3334353839346361660a366563346135356536636532663532643463323462626561336466623333
          66643230393137333466323336623536323865376663333266626139643030633463643135333838
          3263353038623733393530623138323030333930396630333863

# Pool dédié, distinct de RP-CICD-Runners (Forgejo) pour séparer les deux
# fournisseurs CI/CD dans l'UI Proxmox.
vm_pool: "RP-CICD-Runners-GH"
vm_pool_comment: "Flotte runners CI/CD GitHub Actions (generic/kvm/dind)"
vm_tags:
  - "PRODUCTION"
  - "CEDILLE"
  - "CI-RUNNER"
  - "GITHUB"
