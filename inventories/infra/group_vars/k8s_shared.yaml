---
# Shared configuration for all k8s-shared nodes (controlplanes + workers), adopted
# into Ansible for VMs that already existed before this repo (AnsibleInfra#30).
# Overrides par rôle dans k8s_shared_controlplanes/workers.yaml ; overrides par
# node (vm_id, vm_name, vm_proxmox_node, cores/memory) dans host_vars.

# Réutilise le password vaulté de group_vars/pve.yaml (pas de copie locale) via
# hostvars d'un host [pve] : les hosts k8s_shared ne sont pas membres de ce groupe.
vm_proxmox_api:
  user: "root@pam"
  password: "{{ hostvars['pve01.mgmt.etsmtl.club'].pve_api_password }}"
  host: "10.0.21.51"

vm_disk_storage: RBD_Common
vm_ostype: other

# Codifies existing live state (Proxmox API, 2026-09-10) ; controlplane-4 et
# worker-6/7 étaient les seuls à ne pas encore avoir ce pool/tag.
vm_pool: "Management"
# Forme exacte observée sur les 10 VMs existantes (vérifié via pvesh), pas juste
# "agent: true" : inclut fstrim_cloned_disks et le type de canal.
vm_agent: "enabled=1,fstrim_cloned_disks=0,type=virtio"

# Schematic/version confirmés en direct via omnictl le 2026-08-17 (pas copié de
# k8s-poc) ; boot ISO self-install (CD-ROM fantôme observé dans Omni), pas d'import disque.
vm_talos_version: "1.13.7"
vm_talos_schematic_id: "1c8dd53e05ebedfc2cb12090b31b5dc2c16bdba3c42d8e18e717ef5cecc0dfc2"
vm_talos_iso_filename: "talos-1.13.7-k8s-shared-nocloud-amd64.iso"

# DHCP dynamique sur VLAN 1009 (10.5.9.0/24), pas de cloud-init statique. net0=VLAN500,
# net1=VLAN1009 (réseau Talos réel), net2=VLAN247 (IP publique, workers only).
vm_net_bridge: vmbr1
vm_net_device: virtio
vm_net_mtu: 1500
vm_net_mgmt_vlan: 500
vm_net_pod_vlan: 1009

# Talos ne lit pas cloud-init ; champs requis par le rôle cedille.proxmox.vm mais
# inutilisés ici (pas de disque cloud-init sur ces VMs).
vm_user: "unused"
vm_password: "unused"
vm_sshkeys: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJ+RLnMHSHLIy8iHgBY0Xkiv3u1zpXzhuXLOwWSvswuR louis@nixos"

vm_start_after_creation: true
vm_onboot: true
vm_delete_if_exists: false

# Config pour la collection cedille.talos (maintenance Talos/K8s via
# omnictl/talosctl, pilotée depuis GitHub Actions) — cluster géré par
# l'instance Omni cloud cedille.na-west-1.omni.siderolabs.io, pas
# omni.etsmtl.club (self-hébergé, gère uniquement k8s-poc, SA omni-ansible
# séparé). Nom de cluster confirmé via `omnictl get clusters` le 2026-09-19.
#
# k8s-cedille-production-v2 était initialement prévu dans le même chantier,
# mais son repo GitHub est archivé (2026-08-19, découvert le 2026-09-19) —
# ignoré entièrement, pas seulement pour cette variable (voir mémoire
# project_talos_collection_github_sa).
talos_omni_cluster: "k8s-shared"
talos_omni_endpoint: "https://cedille.na-west-1.omni.siderolabs.io:443/"

# SA dédié à l'automatisation GitHub Actions (rôle Operator, pas Admin, pas
# le SA omni-ansible existant) — voir AnsibleRoles/talos/docs/README.md.
# Créé le 2026-09-19 (public key ID 39a537535334850f1333ab594e7bd94ec31c01b0),
# TTL 8760h → expire le 2027-09-19. Comme pour omni-ansible (voir
# docs/omni-saml-auth.md), `serviceaccount renew` ne révoque pas l'ancienne
# clé — prévoir un rappel calendaire avant l'expiration plutôt que de
