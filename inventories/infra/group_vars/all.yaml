# Variables applicables à tout l'inventaire infra (permanent), y compris les
# playbooks hosts: localhost comme playbooks/netbox/*.yaml.

# NetBox — cible du sync Ansible -> NetBox (playbooks/netbox/*.yaml).
# netbox_api_token est un token v1 classique (pas le nouveau format v2
# "Bearer nbt_<key>.<secret>") : les modules netbox.netbox (pynetbox)
# envoient "Authorization: Token <valeur>", incompatible avec le schéma v2.
netbox_api_url: "https://netbox.etsmtl.club"
netbox_api_token: !vault |
  $ANSIBLE_VAULT;1.1;AES256
  31323134353630353063313236626363333934313064333361343933346331663633313361333035
