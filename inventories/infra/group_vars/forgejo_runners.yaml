---
ansible_user: localadmin

vm_cpu_cores: 8
vm_memory_mb: 16384
vm_disk_size: "40G"

vm_disk_image_path: "/var/lib/vz/images/lanets/ubuntu_2404.img"
vm_disk_storage: "RBD_Common"
vm_disk_format: "raw"
vm_disk_device: "virtio0"
vm_cloud_init_storage: "RBD_Common"

vm_delete_if_exists: false
vm_start_after_creation: true
vm_onboot: true

# No pull-through registry mirror on the mgmt network, runners pull directly
# from upstream registries.
docker_registry_mirror_enabled: false

# cedille.docker.install always runs "docker compose up", which fails on an
# empty "services: {}" project ("no service selected"); give it a noop idle service.
install_docker_compose_source_type: inline
install_docker_compose_content: |
  services:
    noop:
      image: alpine:3
      command: ["tail", "-f", "/dev/null"]
      restart: unless-stopped

vm_name: "{{ inventory_hostname }}"
vm_proxmox_node: "{{ 'pve02' if inventory_hostname.startswith('forgejo-runner02') else 'pve01' }}"

# Migrated 2026-09-10 from VLAN21 to the dedicated CI/CD VLAN (tag 40),
# renumbered .10-.18 (clean cutover, not the old last octets).
vm_net:
  mac: "{{ vm_mac }}"
  bridge: "vmbr1"
  vlan: "40"
  device: virtio
  ip: "{{ ansible_host }}"
  netmask: "24"
  gateway: "10.0.40.1"
  nameservers: "1.1.1.1,8.8.8.8"
  search_domain: "mgmt.etsmtl.club"

vm_proxmox_api:
  user: "root@pam"
  password: !vault |
    $ANSIBLE_VAULT;1.1;AES256
    38616663323566326538653235663137303731356666336338303339616164366637373438663366
    3664396432356165363735646236376238633331373332300a356532353031656264333035303939
    61653665626562323564346563336463393633663231653063616566353961353434363338353531
    6333623135383336610a343532623531353331643164353261666333663637643437383861373161
    3564
  host: "10.0.21.51"

# Instance cible ; le token d'enregistrement (/admin/actions/runners) est
# par host, voir host_vars/forgejo-runner0{1,2}.mgmt.etsmtl.club.yaml.
forgejo_runner_instance_url: "https://git.etsmtl.club"

# Pool dédié (2026-09-10), auparavant réparti entre RP-Management-Infra
# (01/02) et non taggé (03 + 6 nouveaux nodes).
vm_pool: "RP-CICD-Runners"
vm_pool_comment: "Flotte runners CI/CD Forgejo (generic/kvm/dind)"
vm_tags:
  - "PRODUCTION"
  - "CEDILLE"
  - "CI-RUNNER"
