---
# Pool "Docker-in-Docker" — pour les jobs de build/push d'images.
# Containerized depuis AnsibleRoles#98/#102 (remplace le bare-metal sans
# isolation précédent) — voir github_runner_containerized dans AnsibleRoles.
vm_disk_size: "80G"

github_runner_labels:
  - "docker-dind"

github_runner_group: "dind"

github_runner_containerized: true
