---
# Pool "Docker-in-Docker" pour builds/push d'images volumineuses. Isolation réelle
# depuis 2026-09-18 (AnsibleRoles feat/dind-real-isolation) : le runner tourne
# désormais dans un conteneur privilégié avec dockerd imbriqué (github_runner_containerized),
# plus l'accès direct au dockerd hôte d'avant. Voir memory ci_dind_pools_audit.
vm_disk_size: "80G"

github_runner_labels:
  - "docker-dind"

github_runner_group: "dind"

github_runner_containerized: true
