# ─── Blackbox exporter ────────────────────────────────────────────────────────
blackbox_exporter_modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
  icmp:
    prober: icmp
    timeout: 5s

# ─── SNMP exporter ────────────────────────────────────────────────────────────
# Module definitions (if_mib, cisco_device) now ship built-in with the
# cedille.monitoring.snmp_exporter role — see AnsibleRoles#69. They carry
# real OID→metric mappings generated by the upstream snmp_exporter
# generator, unlike the hand-rolled walk-only modules this used to define,
# which produced zero usable metrics despite successful SNMP walks.
snmp_exporter_auths:
  infra_v2:
    community: "{{ monitoring_snmp_community }}"
    version: 2
