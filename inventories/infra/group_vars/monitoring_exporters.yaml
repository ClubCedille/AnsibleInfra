# ─── Blackbox exporter ────────────────────────────────────────────────────────
blackbox_exporter_modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
  icmp:
    prober: icmp
    timeout: 5s

# ─── SNMP exporter ────────────────────────────────────────────────────────────
# Modules (if_mib, cisco_device) ship built-in avec le rôle depuis AnsibleRoles#69,
# remplaçant les anciens modules walk-only qui ne produisaient aucune métrique utilisable.
snmp_exporter_auths:
  infra_v2:
    community: "{{ monitoring_snmp_community }}"
    version: 2
