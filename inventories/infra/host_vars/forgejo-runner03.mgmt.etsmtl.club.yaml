# Host-native execution so the job gets direct access to /dev/kvm — needed
# for the opnsense-cloudinit Packer/QEMU image builds. Kept off the default
# "ubuntu-latest" pool used by the two Docker runners.
# The ":host" suffix is required: act_runner falls back to Docker execution
# (image node:22-bookworm, no /dev/kvm) on any label without a scheme.
forgejo_runner_labels:
  - "kvm-runner:host"

# Image builds are long (~10+ min under KVM) and CPU/IO heavy — avoid
# running more than one at a time on this box.
forgejo_runner_capacity: 1

forgejo_runner_extra_groups:
  - kvm

forgejo_runner_extra_packages:
  - qemu-guest-agent
  - qemu-system-x86
  - qemu-utils
  - ovmf
