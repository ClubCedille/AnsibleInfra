# Generated by scripts/gen_inventory.py --sync-compose — do not edit manually
install_docker_compose_source_type: inline
install_docker_compose_filename: docker-compose.yml
install_docker_compose_content: |
  services:
    nodered:
      image: nodered/node-red:latest
      container_name: chall05-nodered
      ports:
        - "1882:1880"
      volumes:
        - ./actual_flows.json:/data/flows.json
        - ./settings.js:/data/settings.js
      restart: unless-stopped

    mosquitto-admin:
      image: eclipse-mosquitto:2
      container_name: chall05-mosquitto
      ports:
        - "1885:1883"
      volumes:
        - ./mosquitto/config:/mosquitto/config
      restart: unless-stopped

    publisher:
      image: eclipse-mosquitto:2
      container_name: chall05-publisher
      depends_on:
        - mosquitto-admin
      volumes:
        - ./publish_admin.sh:/publish.sh
      entrypoint: ["/bin/sh", "/publish.sh"]
      restart: unless-stopped
