# Generated by scripts/gen_inventory.py --sync-compose — do not edit manually
install_docker_compose_source_type: inline
install_docker_compose_filename: docker-compose.yml
install_docker_compose_content: |
  # ─────────────────────────────────────────────────────────────────────────────
  # Nanobot Camp Uplink — shared infrastructure (6 challenges, 1 Redpanda node)
  #
  # Environment variables (set in .env or override at deploy time):
  #   EXTERNAL_HOST     — hostname/IP players use to reach this container
  #                       (default: localhost, works for local dev)
  #   KAFKA_PORT        — external Kafka port players connect to (default: 19092)
  #   SCHEMA_PORT       — external Schema Registry port, served via nginx (default: 18081)
  #   DASHBOARD_PORT    — dashboard HTTP port (default: 8080)
  #   SEED_SECRET       — secret used to derive the XOR key (default: nanobot-dev-2026)
  #   PLAYER_PASSWORD   — SASL password given to players (default: camp2026)
  #   FLAG_0..FLAG_5    — one flag per challenge
  #
  # Exposed to players:
  #   Kafka broker      ${EXTERNAL_HOST}:${KAFKA_PORT}    — SASL/SCRAM-SHA-256
  #                     username: player  password: ${PLAYER_PASSWORD:-camp2026}
  #   Schema Registry   http://${EXTERNAL_HOST}:${SCHEMA_PORT}  — read-only (GET/HEAD)
  #   Dashboard         http://${EXTERNAL_HOST}:${DASHBOARD_PORT}
  #
  # Security model:
  #   INTERNAL listener (9092) — no auth; used by seed/acl/dashboard on Docker network.
  #   EXTERNAL listener (19092) — SASL required; ACLs grant 'player' read-only access.
  #   Schema Registry (8081) — NOT exposed directly; Caddy proxy blocks write methods.
  #   Admin API (9644) — NOT exposed externally.
  # ─────────────────────────────────────────────────────────────────────────────

  services:
    redpanda:
      image: 10.150.0.100:5002/dci-summer-camp/summercamp/web-camp-maintenance-1-src-redpanda:latest
      environment:
        - EXTERNAL_HOST=${EXTERNAL_HOST:-localhost}
        - KAFKA_PORT=${KAFKA_PORT:-19092}
        - INTERNAL_PASSWORD=${INTERNAL_PASSWORD:-rp-schema-2026}
      ports:
        # EXTERNAL Kafka listener — SASL/SCRAM required
        - "${KAFKA_PORT:-19092}:19092"
        # 8081 (Schema Registry) NOT exposed — nginx proxy is the external endpoint
        # 9644 (Admin API)        NOT exposed — internal use only
      healthcheck:
        test: ["CMD-SHELL", "rpk cluster info -X brokers=localhost:9092 >/dev/null 2>&1 || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 20

    seed:
      image: 10.150.0.100:5002/dci-summer-camp/summercamp/web-camp-maintenance-1-src-seed:latest
      restart: "no"
      depends_on:
        redpanda:
          condition: service_healthy
      environment:
        - KAFKA_BOOTSTRAP=redpanda:9092         # INTERNAL — no auth
        - SCHEMA_REGISTRY=http://redpanda:8081  # INTERNAL — no auth
        - SEED_SECRET=${SEED_SECRET:-nanobot-dev-2026}
        - FLAG_0=${FLAG_0:-DCI{L3R4wP4rl3Pl1sFort_a3f7c291e85d}}
        - FLAG_1=${FLAG_1:-DCI{L3Cl41rTr4hitL3Chiffr3_b92e410df736}}
        - FLAG_2=${FLAG_2:-DCI{K4fk4G4rd3T0ut_c48a1b7e3f20}}
        - FLAG_3=${FLAG_3:-DCI{L3Sch3m4C4ch3T0ut_d05e92c81a4f}}
        - FLAG_4=${FLAG_4:-DCI{L0ffs3tS3S0uvi3nt_7b3e1c9af204}}
        - FLAG_5=${FLAG_5:-DCI{Tr4ns4cti0nF4nt0m3_9d51e0a7c3b8}}

    acl:
      image: 10.150.0.100:5002/dci-summer-camp/summercamp/web-camp-maintenance-1-src-acl:latest
      restart: "no"
      # Run after seed completes so topics exist before ACLs are set.
      depends_on:
        seed:
          condition: service_completed_successfully
      environment:
        - KAFKA_BOOTSTRAP=redpanda:9092   # INTERNAL — ANONYMOUS superuser
        - ADMIN_HOST=redpanda:9644        # Admin API — no auth on internal network
        - PLAYER_USER=player
        - PLAYER_PASSWORD=${PLAYER_PASSWORD:-camp2026}

    caddy:
      image: caddy:alpine
      restart: unless-stopped
      volumes:
        - ./src/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      ports:
        - "18081:18081"
      depends_on:
        - redpanda

    logger:
      image: 10.150.0.100:5002/dci-summer-camp/summercamp/web-camp-maintenance-1-src-logger:latest
      restart: unless-stopped
      depends_on:
        acl:
          condition: service_completed_successfully
      environment:
        - KAFKA_BOOTSTRAP=redpanda:9092   # INTERNAL — no auth
        - LOG_INTERVAL_S=30

    dashboard:
      image: 10.150.0.100:5002/dci-summer-camp/summercamp/web-camp-maintenance-1-src-dashboard:latest
      restart: unless-stopped
      depends_on:
        redpanda:
          condition: service_healthy
        acl:
          condition: service_completed_successfully
      environment:
        - KAFKA_BOOTSTRAP=redpanda:9092   # INTERNAL — no auth
        - EXTERNAL_HOST=${EXTERNAL_HOST:-localhost}
        - KAFKA_PORT=${KAFKA_PORT:-19092}
        - SCHEMA_PORT=${SCHEMA_PORT:-18081}
        - PLAYER_PASSWORD=${PLAYER_PASSWORD:-camp2026}
      ports:
        - "8080:8080"
