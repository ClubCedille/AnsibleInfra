---
vm_cpu_type: "host"
vm_cpu_cores: 2
vm_memory_mb: 2048
vm_disk_size: "20G"

vm_disk_image_path: "/var/lib/vz/template/iso/ubuntu-24.04-server-cloudimg-amd64.img"
vm_disk_storage: "RBD_Common"
vm_disk_format: "raw"
vm_disk_device: "virtio0"
vm_cloud_init_storage: "RBD_Common"

vm_delete_if_exists: false
vm_start_after_creation: true
vm_onboot: true

vm_name: "{{ inventory_hostname }}"
vm_proxmox_node: "{{ {0: 'pve01', 1: 'pve02', 2: 'pve03', 3: 'pve04', 4: 'pve07'}[(vm_id | int) % 5] }}"

vm_net:
  bridge: "vmbr1"
  vlan: "68"
  ip: "{{ ansible_host }}"
  netmask: "16"
  gateway: "10.130.0.1"
  nameservers: "1.1.1.1"
  search_domain: "summercamp.etsmtl.club"

netservices_dns:
  enabled: true
  supported_distribution: Ubuntu
  supported_distribution_version: "24.04"

  install:
    update_cache: true
    package_state: present
    packages:
      - bind9
      - bind9-utils
      - dnsutils

  service:
    name: bind9
    state: started
    enabled: true

  paths:
    options_config: /etc/bind/named.conf.options
    local_config: /etc/bind/named.conf.local

  options:
    directory: /var/cache/bind
    recursion: true
    allow_query:
      - 127.0.0.1
      - 10.0.0.0/8
    allow_recursion:
      - 127.0.0.1
      - 10.0.0.0/8
    forwarders:
      - 1.1.1.1
    dnssec_validation: auto
    listen_on_v4:
      - any
    listen_on_v6:
      - any
    extra_statements: []

  local:
    acl_definitions: []
    zones: []

  wait_for_ready: true

  zone_files:
    - src: "{{ playbook_dir }}/templates/camp.zone.j2"
      dest: "{{ netservices_dns.ha.zones[0].master_file if netservices_dns.ha.this_server_role == 'master' else netservices_dns.ha.zones[0].slave_file }}"
    - src: "{{ playbook_dir }}/templates/ctf.zone.j2"
      dest: "{{ netservices_dns.ha.zones[1].master_file if netservices_dns.ha.this_server_role == 'master' else netservices_dns.ha.zones[1].slave_file }}"

  ha:
    enabled: true
    this_server_role: "{{ 'master' if inventory_hostname.startswith('dns01') else 'slave' }}"
    master_ip: "10.130.0.21"
    slave_ip: "10.130.0.22"
    transfer_acl:
      - "10.130.0.22"
    notify:
      - "10.130.0.22"
    zones:
      - name: camp
        master_file: /var/lib/bind/db.camp
        slave_file: /var/cache/bind/db.camp
      - name: ctf
        master_file: /var/lib/bind/db.ctf
        slave_file: /var/cache/bind/db.ctf

