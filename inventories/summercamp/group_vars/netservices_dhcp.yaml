---
vm_cpu_type: "host"
vm_cpu_cores: 2
vm_memory_mb: 2048
vm_disk_size: "20G"

vm_disk_image_path: "/var/lib/vz/template/iso/ubuntu-24.04-server-cloudimg-amd64.img"
vm_disk_storage: "RBD_Common"
vm_disk_format: "raw"
vm_disk_device: "virtio0"
vm_cloud_init_storage: "RBD_Common"

vm_delete_if_exists: false
vm_start_after_creation: true
vm_onboot: true

vm_name: "{{ inventory_hostname }}"
vm_proxmox_node: "{{ {0: 'pve01', 1: 'pve02', 2: 'pve03', 3: 'pve04', 4: 'pve07'}[(vm_id | int) % 5] }}"

vm_net:
  bridge: "vmbr1"
  vlan: "66"
  ip: "{{ ansible_host }}"
  netmask: "16"
  gateway: "10.110.0.1"
  nameservers: "10.130.0.21"
  search_domain: "camp"

netservices_dhcp:
  enabled: true
  supported_distribution: Ubuntu
  supported_distribution_version: "24.04"

  install:
    update_cache: true
    package_state: present
    packages:
      - kea-dhcp4-server
      - kea-ctrl-agent

  service:
    dhcp4_name: kea-dhcp4-server
    ctrl_agent_name: kea-ctrl-agent
    state: started
    enabled: true

  paths:
    dhcp4_config: /etc/kea/kea-dhcp4.conf
    ctrl_agent_config: /etc/kea/kea-ctrl-agent.conf
    dhcp4_control_socket: /run/kea/kea4-ctrl-socket

  ha:
    enabled: true
    mode: hot-standby
    this_server_name: "{{ 'primary' if inventory_hostname.startswith('dhcp01') else 'standby' }}"
    heartbeat_delay: 10000
    max_response_delay: 60000
    max_ack_delay: 5000
    max_unacked_clients: 10
    sync_page_limit: 10000
    primary:
      name: primary
      url: "http://10.110.0.31:8000/"
    standby:
      name: standby
      url: "http://10.110.0.32:8000/"

  kea_dhcp4_config:
    Dhcp4:
      interfaces-config:
        interfaces:
          - "*"
      control-socket:
        socket-type: unix
        socket-name: /run/kea/kea4-ctrl-socket
      lease-database:
        type: memfile
        persist: true
        name: /var/lib/kea/kea-leases4.csv
      valid-lifetime: 4000
      renew-timer: 1000
      rebind-timer: 2000
      client-classes:
        - name: summercamp
          test: "option[60].text == 'summercamp'"
          option-data:
            - name: vendor-encapsulated-options
              data: "{{ flag_06_ctfclient_tlv_hex }}"
              csv-format: false
        - name: not_summercamp
          test: "not (option[60].text == 'summercamp')"
          option-data:
            - name: vendor-encapsulated-options
              data: "{{ flag_03_tlv_hex }}"
              csv-format: false
      subnet4:
        - subnet: "10.110.0.0/16"
          id: 110
          next-server: "{{ ansible_host }}"
          pools:
            - pool: "10.110.1.10 - 10.110.5.255"
          option-data:
            - name: routers
              data: "10.110.0.1"
            - name: domain-name-servers
              data: "10.130.0.21,10.130.0.22"
            - name: tftp-server-name
              data: "{{ ansible_host }}"
            - name: boot-file-name
              data: "netboot.ipxe"
            - name: domain-name
              data: "{{ flag_01_domain }}"
            - name: domain-search
              csv-format: true
              data: "{{ flag_02_domain_search }}"
            - name: v4-captive-portal
              data: "{{ flag_05_portal_url }}"
      option-data: []
      hooks-libraries:
        - library: /usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so
        - library: /usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_ha.so
          parameters:
            high-availability:
              - this-server-name: "{{ 'primary' if inventory_hostname.startswith('dhcp01') else 'standby' }}"
                mode: hot-standby
                heartbeat-delay: 10000
                max-response-delay: 60000
                max-ack-delay: 5000
                max-unacked-clients: 10
                sync-page-limit: 10000
                peers:
                  - name: primary
                    url: "http://10.110.0.31:8000/"
                    role: primary
                    auto-failover: true
                  - name: standby
                    url: "http://10.110.0.32:8000/"
                    role: standby
                    auto-failover: true
      loggers:
        - name: kea-dhcp4
          output_options:
            - output: stdout
          severity: INFO

  kea_ctrl_agent_config:
    Control-agent:
      http-host: 0.0.0.0
      http-port: 8000
      control-sockets:
        dhcp4:
          socket-type: unix
          socket-name: /run/kea/kea4-ctrl-socket

