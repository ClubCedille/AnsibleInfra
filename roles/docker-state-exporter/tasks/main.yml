---
- name: Copy Docker state exporter script
  ansible.builtin.copy:
    src: ctf_docker_state_exporter.py
    dest: "{{ docker_state_exporter_script_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Write Docker state exporter environment file
  ansible.builtin.template:
    src: ctf-docker-state-exporter.env.j2
    dest: "{{ docker_state_exporter_env_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart ctf-docker-state-exporter timer

- name: Write Docker state exporter systemd service unit
  ansible.builtin.template:
    src: ctf-docker-state-exporter.service.j2
    dest: /etc/systemd/system/ctf-docker-state-exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart ctf-docker-state-exporter timer

- name: Write Docker state exporter systemd timer unit
  ansible.builtin.template:
    src: ctf-docker-state-exporter.timer.j2
    dest: /etc/systemd/system/ctf-docker-state-exporter.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart ctf-docker-state-exporter timer

- name: Flush handlers so unit files are active before enabling the timer
  ansible.builtin.meta: flush_handlers

- name: Ensure ctf-docker-state-exporter timer is enabled and started
  ansible.builtin.systemd:
    name: ctf-docker-state-exporter.timer
    state: started
    enabled: true
