---
# ── Summercamp dashboards ──────────────────────────────────────────────────────
- name: Copy Summercamp infrastructure dashboard
  ansible.builtin.copy:
    src: summercamp-infra.json
    dest: /etc/grafana/provisioning/dashboards/summercamp-infra.json
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart Grafana
  become: true

- name: Copy Summercamp per-team challenge status dashboard
  ansible.builtin.copy:
    src: summercamp-challenges.json
    dest: /etc/grafana/provisioning/dashboards/summercamp-challenges.json
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart Grafana
  become: true

# ── Infra dashboards ───────────────────────────────────────────────────────────
- name: Copy infra dashboards
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/grafana/provisioning/dashboards/{{ item }}"
    owner: root
    group: grafana
    mode: "0640"
  loop:
    - infra-overview.json
    - infra-pve-nodes.json
    - infra-pve-cluster.json
    - infra-ceph.json
    - infra-ipmi.json
    - infra-network.json
    - infra-nas.json
    - infra-blackbox.json
    - infra-smart.json
  notify: Restart Grafana
  become: true
