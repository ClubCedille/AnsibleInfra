name: Make Targets

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Cible make a executer"
        required: true
        default: "list-playbooks"
      inventory:
        description: "Inventory (infra ou event)"
        required: true
        default: "infra"
        type: choice
        options:
          - infra
          - event

jobs:
  run-target:
    # ubuntu-latest n'a pas de route vers le réseau de management
    # (10.0.21.0/24) où vivent les cibles réelles — sans ça, tout target qui
    # touche l'infra pour de vrai échouait déjà à la connexion, dry-run ou
    # pas. Les runners self-hosted "generic" sont sur le VLAN CI/CD avec
    # accès à ce réseau.
    runs-on: [self-hosted, generic]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve execution mode
        shell: bash
        run: |
          set -euo pipefail
          ref_name="${GITHUB_REF#refs/heads/}"
          if [ "$ref_name" = "main" ]; then
            echo "DRY_RUN=0" >> "$GITHUB_ENV"
            echo "Mode: real run (main)"
          else
            echo "DRY_RUN=1" >> "$GITHUB_ENV"
            echo "Mode: dry-run (branche != main)"
          fi

      - name: Validate make target
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          {
            echo "venv"
            echo "galaxy-install"
            echo "list-playbooks"
            echo "lint"
            make -s list-playbooks
          } | sort -u > /tmp/allowed-targets.txt

          if ! grep -Fxq "$TARGET" /tmp/allowed-targets.txt; then
            echo "Target invalide: $TARGET"
            echo "Targets autorisees:"
            cat /tmp/allowed-targets.txt
            exit 1
          fi

      - name: Setup venv
        shell: bash
        run: |
          set -euo pipefail
          make venv

      - name: Install galaxy roles
        shell: bash
        run: |
          set -euo pipefail
          make galaxy-install

      - name: Write SSH deploy key
        if: env.HAS_SSH_KEY == 'true'
        shell: bash
        env:
          HAS_SSH_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY != '' }}
          SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ansible_ssh_key"
          chmod 600 "$RUNNER_TEMP/ansible_ssh_key"
          echo "ANSIBLE_PRIVATE_KEY_FILE=$RUNNER_TEMP/ansible_ssh_key" >> "$GITHUB_ENV"

      - name: Run target
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          INVENTORY_NAME: ${{ inputs.inventory }}
        run: |
          set -euo pipefail
          make "$TARGET" inventory="inventories/${INVENTORY_NAME}/hosts.ini" DRY_RUN="$DRY_RUN"

      - name: Clean up SSH deploy key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ansible_ssh_key"
