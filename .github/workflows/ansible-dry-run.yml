name: Ansible Dry Run

# Deux façons de se déclencher :
#   - pull_request : uniquement pour les PRs internes (même repo, pas les
#     forks) — les runners self-hosted "generic" ont un accès réseau au
#     VLAN de management (Proxmox, OPNsense, etc.), donc on ne les expose
#     pas à du code arbitraire venant d'une PR externe sur ce repo public.
#     Toute PR externe reste couverte par le job "Lint" (lint.yml), qui
#     tourne sur ubuntu-latest. Dry-run automatique des playbooks modifiés
#     par la PR.
#   - workflow_dispatch : déclenchement manuel, restreint à la branche
#     main uniquement (voir le guard sur le job) — dry-run à la demande
#     d'une cible `make` choisie, sur l'état actuel de main.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: "Cible make à dry-run (ex: network/github-runners)"
        required: true
      inventory:
        description: "Inventory (infra, lanets ou summercamp)"
        required: true
        default: "infra"
        type: choice
        options:
          - infra
          - lanets
          - summercamp

concurrency:
  group: ansible-dry-run-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  dry-run:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, generic]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine changed playbook targets (pull_request)
        if: github.event_name == 'pull_request'
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${{ github.event.pull_request.base.ref }}"
          # Même convention que playbook_files dans le Makefile (find, pas le
          # wildcard Make qui ne traverse pas les répertoires) : les playbooks
          # peuvent être imbriqués sur 2 niveaux (ex. playbooks/events/lanets/*).
          # :(glob) est nécessaire pour que ** traverse les "/" ; sans lui, un
          # `*` de pathspec git ne matche qu'un seul segment. On exclut les
          # fragments include_tasks/templates/vars/fichiers statiques pour ne
          # garder que les fichiers qui correspondent à une cible `make` réelle.
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR \
              "origin/${{ github.event.pull_request.base.ref }}...HEAD" \
              -- ':(glob)playbooks/**/*.yaml' \
                 ':(exclude,glob)playbooks/**/tasks/**' \
                 ':(exclude,glob)playbooks/**/templates/**' \
                 ':(exclude,glob)playbooks/**/template/**' \
                 ':(exclude,glob)playbooks/**/files/**' \
                 ':(exclude,glob)playbooks/**/vars/**' || true
          )

          mapfile -t targets < <(
            for f in "${files[@]}"; do
              t="${f#playbooks/}"
              echo "${t%.yaml}"
            done | sort -u
          )

          if [ "${#targets[@]}" -eq 0 ]; then
            echo "targets=" >> "$GITHUB_OUTPUT"
          else
            printf -v joined '%s,' "${targets[@]}"
            echo "targets=${joined%,}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate manual target (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        id: manual
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          {
            echo "venv"
            echo "galaxy-install"
            echo "list-playbooks"
            echo "lint"
            make -s list-playbooks
          } | sort -u > /tmp/allowed-targets.txt

          if ! grep -Fxq "$TARGET" /tmp/allowed-targets.txt; then
            echo "Target invalide: $TARGET"
            echo "Targets autorisees:"
            cat /tmp/allowed-targets.txt
            exit 1
          fi
          echo "targets=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Resolve targets to run
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          echo "targets=${{ steps.changed.outputs.targets || steps.manual.outputs.targets }}" >> "$GITHUB_OUTPUT"

      - name: Setup venv
        if: steps.resolve.outputs.targets != ''
        shell: bash
        run: make venv

      - name: Install galaxy roles
        if: steps.resolve.outputs.targets != ''
        shell: bash
        run: make galaxy-install

      - name: Write vault password file
        if: steps.resolve.outputs.targets != '' && env.HAS_VAULT_SECRET == 'true'
        shell: bash
        env:
          HAS_VAULT_SECRET: ${{ secrets.ANSIBLE_VAULT_PASSWORD != '' }}
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$VAULT_PASSWORD" > "$RUNNER_TEMP/ansible_vault_pass"

      - name: Write SSH deploy key
        if: steps.resolve.outputs.targets != '' && env.HAS_SSH_KEY == 'true'
        shell: bash
        env:
          HAS_SSH_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY != '' }}
          SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ansible_ssh_key"
          chmod 600 "$RUNNER_TEMP/ansible_ssh_key"
          echo "ANSIBLE_PRIVATE_KEY_FILE=$RUNNER_TEMP/ansible_ssh_key" >> "$GITHUB_ENV"

      - name: Dry-run targets (--check --diff)
        if: steps.resolve.outputs.targets != ''
        shell: bash
        env:
          TARGETS: ${{ steps.resolve.outputs.targets }}
          HAS_VAULT_SECRET: ${{ secrets.ANSIBLE_VAULT_PASSWORD != '' }}
          INVENTORY_NAME: ${{ inputs.inventory || 'infra' }}
        run: |
          set -euo pipefail
          vault_args=()
          if [ "$HAS_VAULT_SECRET" = "true" ]; then
            vault_args=(VAULT_PASSWORD_FILE="$RUNNER_TEMP/ansible_vault_pass")
          fi

          IFS=',' read -ra targets <<< "$TARGETS"
          status=0
          for t in "${targets[@]}"; do
            echo "::group::make $t DRY_RUN=1"
            if ! make "$t" DRY_RUN=1 inventory_name="$INVENTORY_NAME" "${vault_args[@]}"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"

      - name: No target to run
        if: steps.resolve.outputs.targets == ''
        shell: bash
        run: echo "Aucun playbook modifié par cette PR — rien à dry-run."

      - name: Clean up vault password file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ansible_vault_pass"

      - name: Clean up SSH deploy key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/ansible_ssh_key"
